<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>SPEEDGUARD // HUD</title>
<link rel="manifest" id="manifest-link">
<meta name="theme-color" content="#050607">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap');

  :root{
    --bg:#050607;
    --panel:#0b0f0f;
    --line:#1c2626;
    --cyan:#4dfff0;
    --amber:#ffb020;
    --red:#ff3b3b;
    --dim:#5b7070;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; height:100%; background:var(--bg); color:var(--cyan);
    font-family:'Share Tech Mono', monospace; overflow:hidden;
    user-select:none;
  }
  body{
    display:flex; flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* scanline / vignette overlay */
  .scan{
    position:fixed; inset:0; pointer-events:none; z-index:50;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 1px, transparent 1px, transparent 3px),
      radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.65) 100%);
    mix-blend-mode:overlay;
  }

  header{
    padding:14px 18px 8px;
    display:flex; justify-content:space-between; align-items:baseline;
    font-family:'Orbitron', sans-serif;
  }
  header .logo{ font-size:15px; font-weight:900; letter-spacing:4px; color:var(--cyan); text-shadow:0 0 8px rgba(77,255,240,0.5);}
  header .logo span{color:var(--dim);}
  #clock{font-size:12px; color:var(--dim); letter-spacing:2px;}

  main{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    position:relative;
  }

  .ring{
    position:relative; width:min(78vw,340px); height:min(78vw,340px);
    border-radius:50%;
    border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    box-shadow: inset 0 0 40px rgba(77,255,240,0.05);
  }
  .ring::before{
    content:''; position:absolute; inset:14px; border-radius:50%;
    border:1px dashed var(--line);
  }
  .ring.warn{ border-color: var(--amber); box-shadow: inset 0 0 60px rgba(255,176,32,0.15); }
  .ring.over{ border-color: var(--red); animation:pulse-ring 0.6s infinite; }
  @keyframes pulse-ring{
    0%,100%{ box-shadow: inset 0 0 60px rgba(255,59,59,0.15); }
    50%{ box-shadow: inset 0 0 90px rgba(255,59,59,0.45); }
  }

  #speed{
    font-family:'Orbitron', sans-serif; font-weight:900;
    font-size:min(20vw,88px); line-height:1; color:var(--cyan);
    text-shadow:0 0 18px rgba(77,255,240,0.55);
    transition:color 0.2s;
  }
  .ring.warn #speed{ color:var(--amber); text-shadow:0 0 18px rgba(255,176,32,0.6);}
  .ring.over #speed{ color:var(--red); text-shadow:0 0 22px rgba(255,59,59,0.75);}
  #unit{ font-size:13px; letter-spacing:3px; color:var(--dim); margin-top:2px;}

  .status-row{
    margin-top:22px; display:flex; gap:26px; font-size:11px; letter-spacing:2px; color:var(--dim);
  }
  .status-row b{ color:var(--cyan); font-weight:400;}

  .limit-panel{
    padding:16px 20px calc(20px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);
    background:linear-gradient(180deg, transparent, rgba(77,255,240,0.03));
  }
  .limit-row{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
  }
  .limit-label{ font-size:11px; letter-spacing:3px; color:var(--dim); font-family:'Orbitron',sans-serif;}
  .limit-controls{ display:flex; align-items:center; gap:10px;}
  .limit-controls button{
    width:38px; height:38px; border-radius:6px;
    background:var(--panel); border:1px solid var(--line); color:var(--cyan);
    font-size:20px; font-family:'Orbitron',sans-serif; cursor:pointer;
  }
  .limit-controls button:active{ background:var(--line); }
  #limitVal{
    font-family:'Orbitron',sans-serif; font-weight:700; font-size:26px; min-width:64px; text-align:center;
  }

  .presets{ display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}
  .presets button{
    flex:1; min-width:50px; padding:8px 0; background:var(--panel); border:1px solid var(--line);
    color:var(--dim); font-family:'Share Tech Mono',monospace; font-size:13px; border-radius:4px; cursor:pointer;
  }
  .presets button.active{ color:var(--bg); background:var(--cyan); border-color:var(--cyan); font-weight:700;}

  .toggle-row{
    margin-top:14px; display:flex; align-items:center; justify-content:space-between;
  }
  .toggle-row .limit-label{ color:var(--dim);}
  .switch{
    width:46px; height:26px; border-radius:14px; background:var(--panel); border:1px solid var(--line);
    position:relative; cursor:pointer;
  }
  .switch::after{
    content:''; position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%;
    background:var(--dim); transition:all 0.2s;
  }
  .switch.on{ border-color:var(--cyan); }
  .switch.on::after{ left:22px; background:var(--cyan); box-shadow:0 0 8px rgba(77,255,240,0.8);}

  #gpsWarn{
    position:absolute; top:8px; left:50%; transform:translateX(-50%);
    font-size:10px; letter-spacing:2px; color:var(--amber); display:none;
  }

  #startOverlay{
    position:fixed; inset:0; background:var(--bg); z-index:100;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; padding:30px; text-align:center;
  }
  #startOverlay .logo{ font-family:'Orbitron',sans-serif; font-size:22px; font-weight:900; letter-spacing:6px; color:var(--cyan); text-shadow:0 0 12px rgba(77,255,240,0.6);}
  #startOverlay p{ color:var(--dim); font-size:13px; max-width:280px; line-height:1.6;}
  #startBtn{
    font-family:'Orbitron',sans-serif; font-weight:700; letter-spacing:3px;
    background:transparent; border:1px solid var(--cyan); color:var(--cyan);
    padding:14px 30px; border-radius:4px; font-size:13px; cursor:pointer;
  }
  #startBtn:active{ background:rgba(77,255,240,0.15); }
</style>
</head>
<body>

<div class="scan"></div>

<div id="startOverlay">
  <div class="logo">SPEEDGUARD</div>
  <p>Hlídání rychlosti přes GPS. Nastav limit a app tě zvukově upozorní, když ho překročíš. Vyžaduje povolení polohy.</p>
  <button id="startBtn">SPUSTIT MONITOR</button>
</div>

<header>
  <div class="logo">SPEED<span>GUARD</span></div>
  <div id="clock">--:--:--</div>
</header>

<main>
  <div id="gpsWarn">GPS SIGNÁL SLABÝ</div>
  <div class="ring" id="ring">
    <div style="text-align:center;">
      <div id="speed">0</div>
      <div id="unit">KM/H</div>
    </div>
  </div>
  <div class="status-row">
    <div>LIMIT <b id="limitEcho">50</b></div>
    <div>PŘESNOST <b id="accEcho">--</b></div>
    <div>STAV <b id="stateEcho">OK</b></div>
  </div>
</main>

<div class="limit-panel">
  <div class="limit-row">
    <div class="limit-label">LIMIT ÚSEKU</div>
    <div class="limit-controls">
      <button id="minus">−</button>
      <div id="limitVal">50</div>
      <button id="plus">+</button>
    </div>
  </div>
  <div class="presets">
    <button data-v="30">30</button>
    <button data-v="50" class="active">50</button>
    <button data-v="70">70</button>
    <button data-v="90">90</button>
    <button data-v="130">130</button>
  </div>
  <div class="toggle-row">
    <div class="limit-label">ZVUK (BMW SEATBELT STYL)</div>
    <div class="switch on" id="soundSwitch"></div>
  </div>
  <div class="toggle-row">
    <div class="limit-label">AUTO LIMIT (Z MAPY)</div>
    <div class="switch" id="autoSwitch"></div>
  </div>
  <div id="autoInfo" style="display:none; font-size:10px; letter-spacing:1px; color:var(--dim); margin-top:8px; text-align:right;">ZDROJ: --</div>
</div>

<script>
// ---------- PWA manifest (inline, no separate file needed) ----------
const manifest = {
  name: "SpeedGuard",
  short_name: "SpeedGuard",
  start_url: ".",
  display: "fullscreen",
  background_color: "#050607",
  theme_color: "#050607",
  icons: []
};
document.getElementById('manifest-link').href =
  'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest));

// service worker for basic offline/installable behavior
if ('serviceWorker' in navigator) {
  const swCode = `
    self.addEventListener('install', e => self.skipWaiting());
    self.addEventListener('activate', e => self.clients.claim());
    self.addEventListener('fetch', e => {});
  `;
  const blob = new Blob([swCode], {type:'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
}

// ---------- State ----------
let limit = 50;
let soundOn = true;
let watchId = null;
let audioCtx = null;
let beepInterval = null;
let lastBeepState = 'ok';
let wakeLock = null;

const speedEl = document.getElementById('speed');
const ringEl = document.getElementById('ring');
const limitValEl = document.getElementById('limitVal');
const limitEchoEl = document.getElementById('limitEcho');
const accEchoEl = document.getElementById('accEcho');
const stateEchoEl = document.getElementById('stateEcho');
const gpsWarnEl = document.getElementById('gpsWarn');
const clockEl = document.getElementById('clock');

function setLimit(v){
  limit = Math.max(5, Math.min(150, v));
  limitValEl.textContent = limit;
  limitEchoEl.textContent = limit;
  document.querySelectorAll('.presets button').forEach(b=>{
    b.classList.toggle('active', parseInt(b.dataset.v)===limit);
  });
}
document.getElementById('plus').onclick = ()=>setLimit(limit+5);
document.getElementById('minus').onclick = ()=>setLimit(limit-5);
document.querySelectorAll('.presets button').forEach(b=>{
  b.onclick = ()=>setLimit(parseInt(b.dataset.v));
});

const soundSwitch = document.getElementById('soundSwitch');
soundSwitch.onclick = ()=>{
  soundOn = !soundOn;
  soundSwitch.classList.toggle('on', soundOn);
  if(!soundOn) stopBeep();
};

// ---------- AUTO limit (Overpass / OSM maxspeed lookup) ----------
let autoMode = false;
let lastManualLimit = limit;
let autoFetchBusy = false;
let lastAutoFetch = 0;
const autoSwitch = document.getElementById('autoSwitch');
const autoInfo = document.getElementById('autoInfo');
const limitControls = document.querySelector('.limit-controls');
const presetsEl = document.querySelector('.presets');

autoSwitch.onclick = ()=>{
  autoMode = !autoMode;
  autoSwitch.classList.toggle('on', autoMode);
  autoInfo.style.display = autoMode ? 'block' : 'none';
  limitControls.style.opacity = autoMode ? '0.35' : '1';
  presetsEl.style.opacity = autoMode ? '0.35' : '1';
  limitControls.style.pointerEvents = autoMode ? 'none' : 'auto';
  presetsEl.style.pointerEvents = autoMode ? 'none' : 'auto';
  if(autoMode){
    lastManualLimit = limit;
    autoInfo.textContent = 'ZDROJ: HLEDÁM...';
  } else {
    setLimit(lastManualLimit);
  }
};

async function fetchSpeedLimitNear(lat, lon){
  // nearest road of any kind within 40m — do NOT require maxspeed tag,
  // since most Czech roads outside main routes don't have it set
  const q = `[out:json][timeout:10];
    way(around:40,${lat},${lon})[highway];
    out tags center 5;`;
  const url = 'https://overpass-api.de/api/interpreter?data=' + encodeURIComponent(q);
  const res = await fetch(url);
  if(!res.ok) throw new Error('overpass ' + res.status);
  const data = await res.json();
  if(!data.elements || !data.elements.length) return null;

  // prefer ways that actually have a maxspeed tag, otherwise take the first
  const withTag = data.elements.find(e => e.tags && e.tags.maxspeed);
  const el = withTag || data.elements[0];
  const tags = el.tags || {};
  const roadName = tags.name || tags.ref || (tags.highway ? czechHighwayLabel(tags.highway) : 'úsek bez názvu');

  // 1) explicit maxspeed tag wins
  if(tags.maxspeed){
    let val = parseInt(tags.maxspeed);
    if(!isNaN(val)) return { limit: val, name: roadName, source: 'tag' };
    if(/urban/i.test(tags.maxspeed)) return { limit: 50, name: roadName, source: 'tag' };
    if(/rural/i.test(tags.maxspeed)) return { limit: 90, name: roadName, source: 'tag' };
    if(/motorway/i.test(tags.maxspeed)) return { limit: 130, name: roadName, source: 'tag' };
  }

  // 2) infer from road class per Czech traffic law (zákon 361/2000 Sb.)
  const hw = tags.highway;
  if(hw === 'motorway' || hw === 'motorway_link') return { limit: 130, name: roadName, source: 'odhad' };
  if(hw === 'trunk' || hw === 'trunk_link') return { limit: 110, name: roadName, source: 'odhad' };
  if(hw === 'living_street') return { limit: 20, name: roadName, source: 'odhad' };
  if(hw === 'residential' || hw === 'service' || hw === 'unclassified'){
    return { limit: 50, name: roadName, source: 'odhad (v obci)' };
  }
  if(hw === 'primary' || hw === 'secondary' || hw === 'tertiary'){
    // could be in or out of village — check for nearby settlement context
    const urban = await isNearSettlement(lat, lon);
    return { limit: urban ? 50 : 90, name: roadName, source: 'odhad' };
  }

  // unknown road class — fall back to conservative in-village default
  return { limit: 50, name: roadName, source: 'odhad' };
}

function czechHighwayLabel(hw){
  const map = {
    motorway:'dálnice', trunk:'rychlostní silnice', primary:'silnice I. třídy',
    secondary:'silnice II. třídy', tertiary:'silnice III. třídy',
    residential:'místní komunikace', living_street:'obytná zóna', service:'účelová komunikace'
  };
  return map[hw] || 'silnice';
}

async function isNearSettlement(lat, lon){
  try{
    const q = `[out:json][timeout:8];
      (
        way(around:80,${lat},${lon})[landuse=residential];
        way(around:80,${lat},${lon})[building];
        node(around:80,${lat},${lon})[place];
      );
      out tags 3;`;
    const url = 'https://overpass-api.de/api/interpreter?data=' + encodeURIComponent(q);
    const res = await fetch(url);
    if(!res.ok) return false;
    const data = await res.json();
    return !!(data.elements && data.elements.length);
  }catch(e){
    return false;
  }
}

async function autoUpdateLimit(lat, lon){
  const now = Date.now();
  if(autoFetchBusy || now - lastAutoFetch < 15000) return; // throttle: max once/15s
  autoFetchBusy = true;
  lastAutoFetch = now;
  try{
    const result = await fetchSpeedLimitNear(lat, lon);
    if(result){
      setLimit(result.limit);
      autoInfo.textContent = 'ZDROJ: ' + result.name.toUpperCase() + ' — ' + result.source.toUpperCase() + ' (' + result.limit + ')';
    } else {
      autoInfo.textContent = 'ZDROJ: NEZNÁMÝ, PONECHÁVÁM ' + limit;
    }
  }catch(e){
    autoInfo.textContent = 'ZDROJ: OFFLINE / CHYBA';
  }finally{
    autoFetchBusy = false;
  }
}

function tickClock(){
  const d = new Date();
  clockEl.textContent = d.toLocaleTimeString('cs-CZ', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
setInterval(tickClock, 1000);
tickClock();

// ---------- Audio: BMW seatbelt-style warning beep ----------
function ensureAudio(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if(audioCtx.state === 'suspended') audioCtx.resume();
}

function playBeep(){
  ensureAudio();
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'square';
  osc.frequency.setValueAtTime(2200, now);
  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(0.35, now + 0.005);
  gain.gain.linearRampToValueAtTime(0, now + 0.09);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + 0.1);
}

function startBeep(intervalMs){
  stopBeep();
  playBeep();
  beepInterval = setInterval(playBeep, intervalMs);
}
function stopBeep(){
  if(beepInterval){ clearInterval(beepInterval); beepInterval = null; }
}

// ---------- Geolocation ----------
function msToKmh(ms){ return ms==null ? 0 : ms*3.6; }

function handlePosition(pos){
  const c = pos.coords;
  const kmh = c.speed != null ? msToKmh(c.speed) : null;

  accEchoEl.textContent = c.accuracy ? Math.round(c.accuracy)+'m' : '--';
  gpsWarnEl.style.display = (c.accuracy && c.accuracy > 30) ? 'block' : 'none';

  if(autoMode){
    autoUpdateLimit(c.latitude, c.longitude);
  }

  if(kmh == null){
    stateEchoEl.textContent = 'ČEKÁM';
    return;
  }

  const shown = Math.round(kmh);
  speedEl.textContent = shown;

  const over = kmh - limit;
  let newState = 'ok';
  if(over >= 10) newState = 'over';
  else if(over >= 2) newState = 'warn';

  ringEl.classList.remove('warn','over');
  if(newState === 'over'){
    ringEl.classList.add('over');
    stateEchoEl.textContent = 'PŘEKROČENO';
    if(soundOn){
      if(lastBeepState !== 'over') startBeep(160);
    } else stopBeep();
  } else if(newState === 'warn'){
    ringEl.classList.add('warn');
    stateEchoEl.textContent = 'POZOR';
    if(soundOn){
      if(lastBeepState !== 'warn') startBeep(750);
    } else stopBeep();
  } else {
    stateEchoEl.textContent = 'OK';
    stopBeep();
  }
  lastBeepState = newState;
}

function handleError(err){
  stateEchoEl.textContent = 'GPS CHYBA';
  gpsWarnEl.style.display = 'block';
  gpsWarnEl.textContent = 'GPS NEDOSTUPNÉ: ' + err.message;
}

function startWatch(){
  if(!('geolocation' in navigator)){
    stateEchoEl.textContent = 'BEZ GPS';
    return;
  }
  watchId = navigator.geolocation.watchPosition(handlePosition, handleError, {
    enableHighAccuracy: true,
    maximumAge: 1000,
    timeout: 10000
  });
}

async function requestWakeLock(){
  try{
    if('wakeLock' in navigator){
      wakeLock = await navigator.wakeLock.request('screen');
    }
  }catch(e){}
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible' && watchId != null) requestWakeLock();
});

// ---------- Start flow ----------
document.getElementById('startBtn').onclick = ()=>{
  ensureAudio();
  playBeep();
  startWatch();
  requestWakeLock();
  document.getElementById('startOverlay').style.display = 'none';
};

setLimit(50);
</script>
</body>
</html>
