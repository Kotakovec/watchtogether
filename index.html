    <!-- Leaflet.js pro mapy -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --bg-color: #0c0c0c;
            --panel-bg: #161616;
            --accent-color: #ff3b30;
            --green-color: #04b033;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Mapa přes celou horní část */
        #map {
            flex: 1;
            width: 100%;
            background-color: var(--bg-color);
        }

        /* Tmavý filtr na mapové podklady */
        .leaflet-tile-container {
            filter: invert(100%) hue-rotate(180deg) brightness(60%) contrast(90%);
        }

        .leaflet-container {
            background: var(--bg-color) !important;
        }

        /* Skrytí otravných ovládacích prvků mapy pro čistý vzhled */
        .leaflet-control-attribution {
            display: none !important;
        }

        /* Horní plovoucí status lišta */
        .status-toast {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(22, 22, 22, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 13px;
            color: #aaa;
            max-width: 90%;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .status-toast.error {
            border-color: var(--accent-color);
            color: #ff8e88;
        }

        /* Spodní ovládací panel */
        .control-panel {
            background-color: var(--panel-bg);
            padding: 25px 20px 40px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid #222;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.7);
            z-index: 1001;
        }

        /* Rychlostní značka (levá strana) */
        .speed-limit-sign {
            width: 85px;
            height: 85px;
            border: 8px solid var(--accent-color);
            border-radius: 50%;
            background-color: #222;
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: 900;
            box-shadow: 0 4px 15px rgba(255, 59, 48, 0.2);
            transition: border-color 0.3s ease;
        }

        /* Aktuální rychlost (střed) */
        .current-speed-box {
            text-align: center;
            flex: 1;
        }

        .speed-value {
            font-size: 76px;
            font-weight: 900;
            line-height: 1;
            letter-spacing: -2px;
            font-variant-numeric: tabular-nums;
        }

        .speed-unit {
            font-size: 13px;
            color: #666;
            text-transform: uppercase;
            font-weight: bold;
            margin-top: 4px;
            letter-spacing: 1px;
        }

        /* Tlačítko pro zvuk (pravá strana) */
        .gong-button {
            background-color: var(--green-color);
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(4, 176, 51, 0.3);
            transition: all 0.2s ease;
            min-width: 120px;
            text-align: center;
        }

        .gong-button.muted {
            background-color: #333;
            box-shadow: none;
            color: #888;
        }

        .gong-button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

<!-- Status hlášky nahoře -->
<div class="status-toast" id="status">Stabilizuji GPS připojení...</div>

<!-- Mapa -->
<div id="map"></div>

<!-- Spodní Panel -->
<div class="control-panel">
    <!-- Dopravní značka s limitem -->
    <div class="speed-limit-sign" id="limit-sign">--</div>
    
    <!-- Aktuální rychlost -->
    <div class="current-speed-box">
        <div class="speed-value" id="current-speed">0</div>
        <div class="speed-unit">KM/H</div>
    </div>

    <!-- Přepínač zvuku -->
    <button class="gong-button" id="gong-btn">Gong: ZAP</button>
</div>

<script>
    let map, userMarker, accuracyCircle;
    let speechEnabled = true;
    let currentLimit = 50; 
    let lastSpokenTime = 0;
    const speechDelay = 3500; // Zamezení koktání hlasu

    // Lokální databáze silnic v operační paměti
    let localRoadsDatabase = [];
    let lastFetchedArea = null;

    // Více záložních Overpass serverů pro eliminaci výpadků
    const OVERPASS_SERVERS = [
        "https://overpass-api.de/api/interpreter",
        "https://overpass.kumi.systems/api/interpreter",
        "https://lz4.overpass-api.de/api/interpreter",
        "https://z.overpass-api.de/api/interpreter"
    ];
    let currentServerIndex = 0;

    const statusElement = document.getElementById('status');
    const speedElement = document.getElementById('current-speed');
    const limitSignElement = document.getElementById('limit-sign');
    const gongBtn = document.getElementById('gong-btn');

    // Inicializace mapy a GPS
    function init() {
        // Výchozí pozice Brno, dokud se nenačte GPS
        map = L.map('map', { 
            zoomControl: false,
            attributionControl: false 
        }).setView([49.195, 16.608], 16);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        // Vzhled markeru pozice uživatele
        const pulseIcon = L.divIcon({
            className: 'custom-div-icon',
            html: `<div style="background-color: #0a84ff; width: 16px; height: 16px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 10px rgba(10,132,255,0.8);"></div>`,
            iconSize: [16, 16],
            iconAnchor: [8, 8]
        });

        userMarker = L.marker([49.195, 16.608], { icon: pulseIcon }).addTo(map);
        accuracyCircle = L.circle([49.195, 16.608], {
            radius: 0,
            fillColor: '#0a84ff',
            fillOpacity: 0.15,
            color: 'transparent'
        }).addTo(map);

        // Zapnutí neustálého sledování polohy
        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(onLocationSuccess, onLocationError, {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            });
        } else {
            showStatus("Chyba: GPS není podporováno.", true);
        }
    }

    // Obsluha tlačítka hlasu
    gongBtn.addEventListener('click', () => {
        speechEnabled = !speechEnabled;
        if (speechEnabled) {
            gongBtn.textContent = "Gong: ZAP";
            gongBtn.classList.remove('muted');
            speak("Voice alerts active");
        } else {
            gongBtn.textContent = "Gong: VYP";
            gongBtn.classList.add('muted');
        }
    });

    // Zpracování GPS koordinátů
    async function onLocationSuccess(position) {
        const coords = position.coords;
        const lat = coords.latitude;
        const lon = coords.longitude;

        // Převod rychlosti z m/s na km/h
        let speedKMH = Math.round((coords.speed || 0) * 3.6);
        if (speedKMH < 0) speedKMH = 0;

        // Update UI prvků
        speedElement.textContent = speedKMH;
        userMarker.setLatLng([lat, lon]);
        accuracyCircle.setLatLng([lat, lon]).setRadius(coords.accuracy);
        map.setView([lat, lon], 16);

        // Načtení širšího okolí na pozadí (pokud jsme se posunuli)
        triggerBackgroundPrefetch(lat, lon);

        // Bleskové porovnání s lokální staženou db
        const matchedLimit = findLimitInLocalDatabase(lat, lon);
        if (matchedLimit !== null) {
            currentLimit = matchedLimit;
            limitSignElement.textContent = currentLimit;
        }

        // Výpočet překročení rychlosti (+ 2 km/h)
        if (speedKMH >= (currentLimit + 2) && speechEnabled) {
            triggerAlert();
        }
    }

    function onLocationError(error) {
        console.error(error);
        showStatus("Ztráta GPS signálu...", true);
    }

    // Pomocná funkce pro zobrazení toast zprávy nahoře
    function showStatus(text, isError = false) {
        statusElement.textContent = text;
        if (isError) {
            statusElement.classList.add('error');
        } else {
            statusElement.classList.remove('error');
        }
        statusElement.style.opacity = "1";
    }

    // Haversine formula pro vzdálenost bodů v metrech
    function getDistance(lat1, lon1, lat2, lon2) {
        const R = 6371000;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c;
    }

    // Vyhledání nejbližší silnice v lokální in-memory paměti
    function findLimitInLocalDatabase(lat, lon) {
        if (localRoadsDatabase.length === 0) return null;

        let closestRoad = null;
        let minDistance = 35; // hledáme silnici v okruhu maximálně 35 metrů

        for (const road of localRoadsDatabase) {
            const dist = getDistance(lat, lon, road.lat, road.lon);
            if (dist < minDistance) {
                minDistance = dist;
                closestRoad = road;
            }
        }
        return closestRoad ? closestRoad.limit : null;
    }

    // Pomocný fetch s timeoutem pro slabý mobilní signál
    async function fetchWithTimeout(resource, options = {}) {
        const { timeout = 6000 } = options;
        const controller = new AbortController();
        const id = setTimeout(() => controller.abort(), timeout);
        try {
            const response = await fetch(resource, { ...options, signal: controller.signal });
            clearTimeout(id);
            return response;
        } catch (error) {
            clearTimeout(id);
            throw error;
        }
    }

    // Předstahování oblasti na pozadí ze záložních serverů
    async function triggerBackgroundPrefetch(lat, lon) {
        if (!lastFetchedArea || getDistance(lastFetchedArea.lat, lastFetchedArea.lon, lat, lon) > 500) {
            lastFetchedArea = { lat, lon };
            
            const radius = 1000; // stahujeme 1km kruh kolem pozice
            const query = `[out:json][timeout:10];way(around:${radius},${lat},${lon})["maxspeed"];out tags center;`;
            
            let success = false;
            let attempts = 0;

            while (!success && attempts < 3) {
                const serverUrl = OVERPASS_SERVERS[currentServerIndex];
                const url = `${serverUrl}?data=${encodeURIComponent(query)}`;
                
                try {
                    const response = await fetchWithTimeout(url, { timeout: 5000 });
                    if (!response.ok) throw new Error();
                    
                    const data = await response.json();

                    if (data.elements) {
                        const newRoads = data.elements.map(el => {
                            let rawLimit = el.tags.maxspeed;
                            let limitNum = 50; 

                            if (rawLimit === "urban" || rawLimit.includes("urban")) limitNum = 50;
                            else if (rawLimit === "rural" || rawLimit.includes("rural")) limitNum = 90;
                            else if (rawLimit === "motorway" || rawLimit.includes("motorway")) limitNum = 130;
                            else {
                                const parsed = parseInt(rawLimit);
                                if (!isNaN(parsed)) limitNum = parsed;
                            }

                            return {
                                lat: el.center.lat,
                                lon: el.center.lon,
                                limit: limitNum
                            };
                        });

                        localRoadsDatabase = [...localRoadsDatabase, ...newRoads];
                        showStatus("Limity silnic aktualizovány.");
                        success = true;
                    }
                } catch (e) {
                    console.warn(`Server ${serverUrl} neodpovídá, zkouším záložní...`);
                    currentServerIndex = (currentServerIndex + 1) % OVERPASS_SERVERS.length;
                    attempts++;
                }
            }

            if (!success) {
                showStatus("Chyba stahování limitů (zkusím znovu za chvíli)", true);
            }
        }
    }

    // Text-to-Speech upozornění
    function speak(text) {
        if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 1.1;
            window.speechSynthesis.speak(utterance);
        }
    }

    function triggerAlert() {
        const now = Date.now();
        if (now - lastSpokenTime > speechDelay) {
            speak("Slow down");
            lastSpokenTime = now;
        }
    }

    // Spuštění po načtení stránky
    window.onload = init;

    // Registrace Service Workeru
    if ('serviceWorker' in navigator) {
        const swCode = `
            self.addEventListener('install', (e) => self.skipWaiting());
            self.addEventListener('fetch', (e) => {});
        `;
        const blob = new Blob([swCode], {type: 'application/javascript'});
        const swUrl = URL.createObjectURL(blob);
        navigator.serviceWorker.register(swUrl).catch(err => console.error(err));
    }
</script>

</body>
</html>
