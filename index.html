<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Speed Guardian - Screen OCR</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="data:application/manifest+json;base64,ewogICJuYW1lIjogIlNwZWVkIEd1YXJkaWFuIE9DUiIsCiAgInNob3J0X25hbWUiOiAiU3BlZWRPQ1IiLAogICJzdGFydF91cmwiOiAiLiIsCiAgImRpc3BsYXkiOiAic3RhbmRhbG9uZSIsCiAgImJhY2tncm91bmRfY29sb3IiOiAiIzBjMGMwYyIsCiAgInRoZW1lX2NvbG9yIjogIiNmZjNiMzAiLAogICJpY29ucyI6IFsKICAgIHsKICAgICAgInNyYyI6ICJodHRwczovL2Nkbi1pY29ucy1wbmcuZmxhdGljb24uY29tLzUxMi8yODcvMjg3NjI4LnBuZyIsCiAgICAgICJ0eXBlIjogImltYWdlL3BuZyIsCiAgICAgICJzaXplcyI6ICI1MTJ4NTEyIgogICAgfQogIF0KfQ==">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Tesseract.js pro OCR (čtení textu z obrazovky) -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <style>
        :root {
            --bg-color: #0c0c0c;
            --panel-bg: #161616;
            --accent-color: #ff3b30;
            --green-color: #04b033;
            --blue-color: #007aff;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Video / Canvas kontejner */
        #container {
            flex: 1;
            position: relative;
            width: 100%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        video {
            display: none; /* Video běží skrytě na pozadí */
        }

        /* 1:1 Vykreslovací plátno streamu */
        canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* Overlay pro výběr výřezu */
        #selection-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .crop-area {
            position: absolute;
            border: 2px dashed var(--accent-color);
            background: rgba(255, 59, 48, 0.15);
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.6);
            display: none;
        }

        /* Tři kulatá tlačítka vpravo nahoře */
        .top-controls {
            position: absolute;
            top: 40px;
            right: 20px;
            display: flex;
            gap: 12px;
            z-index: 10;
        }

        .circle-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(22, 22, 22, 0.85);
            backdrop-filter: blur(10px);
            color: var(--text-color);
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: all 0.2s ease;
        }

        .circle-btn:active {
            transform: scale(0.9);
        }

        .circle-btn.active {
            background: var(--green-color);
            border-color: var(--green-color);
        }

        .circle-btn.cropping-mode {
            background: var(--blue-color);
            border-color: var(--blue-color);
            animation: pulse-blue 1.5s infinite;
        }

        @keyframes pulse-blue {
            0% { box-shadow: 0 0 0 0 rgba(0, 122, 255, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(0, 122, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 122, 255, 0); }
        }

        /* Spodní info bar a zobrazení výřezu */
        .bottom-panel {
            background-color: var(--panel-bg);
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid #222;
            z-index: 10;
        }

        .debug-crop-preview {
            width: 100px;
            height: 50px;
            background: #000;
            border: 1px solid #444;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #crop-canvas-preview {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .ocr-results {
            flex: 1;
            margin-left: 20px;
            font-size: 14px;
            color: #aaa;
        }

        .ocr-value {
            font-size: 24px;
            font-weight: bold;
            color: #fff;
        }
    </style>
</head>
<body>

<!-- Vrchní ovládací tlačítka -->
<div class="top-controls">
    <!-- 1. Audio Gong -->
    <button class="circle-btn active" id="audio-btn" title="Zapnout/Vypnout Gong">🔊</button>
    <!-- 2. Volba okna / obrazovky -->
    <button class="circle-btn" id="select-screen-btn" title="Vybrat okno Waze">🖥️</button>
    <!-- 3. Nástroj Výstřižek (Crop) -->
    <button class="circle-btn" id="crop-tool-btn" title="Označit zónu rychlosti">✂️</button>
</div>

<!-- Hlavní zrcadlová plocha -->
<div id="container">
    <video id="webcam" autoplay playsinline></video>
    <canvas id="mirror-canvas"></canvas>
    
    <!-- Vrstva pro kreslení výběru výstřižku -->
    <div id="selection-overlay">
        <div class="crop-area" id="crop-indicator"></div>
    </div>
</div>

<!-- Spodní debug panel -->
<div class="bottom-panel">
    <div class="debug-crop-preview">
        <canvas id="crop-canvas-preview"></canvas>
    </div>
    <div class="ocr-results">
        <div>Detekovaný text:</div>
        <div class="ocr-value" id="ocr-detected-text">--</div>
    </div>
</div>

<script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('mirror-canvas');
    const ctx = canvas.getContext('2d');

    const cropCanvasPreview = document.getElementById('crop-canvas-preview');
    const cropPreviewCtx = cropCanvasPreview.getContext('2d');

    const selectionOverlay = document.getElementById('selection-overlay');
    const cropIndicator = document.getElementById('crop-indicator');

    const audioBtn = document.getElementById('audio-btn');
    const selectScreenBtn = document.getElementById('select-screen-btn');
    const cropToolBtn = document.getElementById('crop-tool-btn');
    const ocrDetectedText = document.getElementById('ocr-detected-text');

    let stream = null;
    let isCroppingMode = false;
    let gongEnabled = true;
    let audioCtx = null;

    // Koordináty vybraného výřezu (relativní k plátnu 0-1)
    let cropCoords = { x: 0.1, y: 0.1, w: 0.2, h: 0.1 }; 
    let isDrawing = false;
    let startX = 0, startY = 0;

    // Pípání
    let beepIntervalId = null;
    let currentBeepSpeedMode = null; 

    // Inicializace zvuku
    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    audioBtn.addEventListener('click', () => {
        initAudio();
        gongEnabled = !gongEnabled;
        if (gongEnabled) {
            audioBtn.textContent = "🔊";
            audioBtn.classList.add('active');
            playSingleBeep(0.1);
        } else {
            audioBtn.textContent = "🔇";
            audioBtn.classList.remove('active');
            stopBeepLoop();
        }
    });

    // --- 1. ZRCADLENÍ OBRAZOVKY (Screen Capture API) ---
    selectScreenBtn.addEventListener('click', async () => {
        try {
            // Požádáme uživatele o výběr okna/obrazovky (např. Waze)
            stream = await navigator.mediaDevices.getDisplayMedia({
                video: { cursor: "always" },
                audio: false
            });
            video.srcObject = stream;
            selectScreenBtn.classList.add('active');
            
            video.onloadedmetadata = () => {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                requestAnimationFrame(tick);
                // Nastartujeme OCR smyčku každých 600ms
                setInterval(runOCR, 600);
            };
        } catch (err) {
            console.error("Chyba při sdílení obrazovky:", err);
        }
    });

    // Smyčka překreslování obrazu 1:1 na Canvas
    function tick() {
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            drawCropPreview();
        }
        requestAnimationFrame(tick);
    }

    // --- 2. SELECTOR VÝŘEZU (Windows Screenshot styl) ---
    cropToolBtn.addEventListener('click', () => {
        isCroppingMode = !isCroppingMode;
        if (isCroppingMode) {
            cropToolBtn.classList.add('cropping-mode');
            canvas.style.cursor = 'crosshair';
        } else {
            cropToolBtn.classList.remove('cropping-mode');
            canvas.style.cursor = 'default';
        }
    });

    // Detekce kreslení na canvasu
    canvas.addEventListener('mousedown', (e) => {
        if (!isCroppingMode) return;
        const rect = canvas.getBoundingClientRect();
        startX = e.clientX - rect.left;
        startY = e.clientY - rect.top;
        isDrawing = true;

        cropIndicator.style.left = startX + 'px';
        cropIndicator.style.top = startY + 'px';
        cropIndicator.style.width = '0px';
        cropIndicator.style.height = '0px';
        cropIndicator.style.display = 'block';
    });

    canvas.addEventListener('mousemove', (e) => {
        if (!isDrawing) return;
        const rect = canvas.getBoundingClientRect();
        const currentX = e.clientX - rect.left;
        const currentY = e.clientY - rect.top;

        const width = currentX - startX;
        const height = currentY - startY;

        cropIndicator.style.width = Math.abs(width) + 'px';
        cropIndicator.style.height = Math.abs(height) + 'px';
        cropIndicator.style.left = (width > 0 ? startX : currentX) + 'px';
        cropIndicator.style.top = (height > 0 ? startY : currentY) + 'px';
    });

    canvas.addEventListener('mouseup', (e) => {
        if (!isDrawing) return;
        isDrawing = false;
        isCroppingMode = false;
        cropToolBtn.classList.remove('cropping-mode');
        canvas.style.cursor = 'default';

        const rect = canvas.getBoundingClientRect();
        const endX = e.clientX - rect.left;
        const endY = e.clientY - rect.top;

        // Přepočet fyzických pixelů na relativní souřadnice (0-1) pro zachování škálování
        const x = Math.min(startX, endX) / rect.width;
        const y = Math.min(startY, endY) / rect.height;
        const w = Math.abs(endX - startX) / rect.width;
        const h = Math.abs(endY - startY) / rect.height;

        cropCoords = { x, y, w, h };
        cropIndicator.style.display = 'none';
    });

    // Vykreslení malého náhledu vybraného výřezu dole v liště
    function drawCropPreview() {
        if (!stream) return;
        const sourceX = cropCoords.x * canvas.width;
        const sourceY = cropCoords.y * canvas.height;
        const sourceW = cropCoords.w * canvas.width;
        const sourceH = cropCoords.h * canvas.height;

        if (sourceW > 0 && sourceH > 0) {
            cropCanvasPreview.width = sourceW;
            cropCanvasPreview.height = sourceH;
            cropPreviewCtx.drawImage(canvas, sourceX, sourceY, sourceW, sourceH, 0, 0, sourceW, sourceH);
        }
    }

    // --- 3. ANALÝZA TEXTU V REÁLNÉM ČASE (OCR) ---
    async function runOCR() {
        if (!stream || isFetchingOCR) return;
        isFetchingOCR = true;

        // Vytáhneme obrázek z našeho skrytého náhledového plátna
        const dataUrl = cropCanvasPreview.toDataURL('image/png');

        try {
            // Použijeme Tesseract.js pro bleskové přečtení číslic (nastaveno pouze na čísla pro rychlost)
            const result = await Tesseract.recognize(dataUrl, 'eng', {
                tessedit_char_whitelist: '0123456789/', // Hledáme jen čísla nebo lomítka
            });

            const text = result.data.text.trim();
            ocrDetectedText.textContent = text || "--";

            // Rozparsujeme text (např. pokud Waze ukazuje "58 / 50")
            parseSpeedAndLimit(text);

        } catch (e) {
            console.error("OCR selhalo:", e);
        }

        isFetchingOCR = false;
    }

    let isFetchingOCR = false;

    function parseSpeedAndLimit(text) {
        // Hledáme jakákoliv čísla v textu
        const numbers = text.match(/\d+/g);
        if (!numbers || numbers.length === 0) return;

        let detectedSpeed = 0;
        let detectedLimit = 50; // Výchozí

        if (numbers.length >= 2) {
            // Waze často píše aktuální rychlost jako první a limit jako druhý (např. "58" a "50")
            detectedSpeed = parseInt(numbers[0]);
            detectedLimit = parseInt(numbers[1]);
        } else if (numbers.length === 1) {
            // Pokud vidíme jen jedno číslo, předpokládáme, že je to naše aktuální rychlost
            detectedSpeed = parseInt(numbers[0]);
        }

        evaluateSpeed(detectedSpeed, detectedLimit);
    }

    function evaluateSpeed(speed, limit) {
        const overSpeed = speed - limit;

        if (overSpeed >= 10) {
            startBeepLoop("fast", 100);
        } else if (overSpeed >= 2) {
            startBeepLoop("slow", 333);
        } else {
            stopBeepLoop();
        }
    }

    // --- 4. GONG / PÍPÁNÍ ---
    function startBeepLoop(mode, msInterval) {
        if (!gongEnabled) {
            stopBeepLoop();
            return;
        }
        if (currentBeepSpeedMode === mode) return;

        stopBeepLoop();
        currentBeepSpeedMode = mode;
        playSingleBeep(mode === "fast" ? 0.05 : 0.08);

        beepIntervalId = setInterval(() => {
            playSingleBeep(mode === "fast" ? 0.05 : 0.08);
        }, msInterval);
    }

    function stopBeepLoop() {
        if (beepIntervalId !== null) {
            clearInterval(beepIntervalId);
            beepIntervalId = null;
        }
        currentBeepSpeedMode = null;
    }

    function playSingleBeep(duration) {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc.type = 'sine';
            osc.frequency.setValueAtTime(950, audioCtx.currentTime);

            gainNode.gain.setValueAtTime(0.4, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + duration);
        } catch (e) {
            console.error(e);
        }
    }

    window.onload = initAudio;
</script>

</body>
</html>
