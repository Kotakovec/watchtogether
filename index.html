<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Speed Guardian - Screen OCR</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="data:application/manifest+json;base64,ewogICJuYW1lIjogIlNwZWVkIEd1YXJkaWFuIE9DUiIsCiAgInNob3J0X25hbWUiOiAiU3BlZWRPQ1IiLAogICJzdGFydF91cmwiOiAiLiIsCiAgImRpc3BsYXkiOiAic3RhbmRhbG9uZSIsCiAgImJhY2tncm91bmRfY29sb3IiOiAiIzBjMGMwYyIsCiAgInRoZW1lX2NvbG9yIjogIiNmZjNiMzAiLAogICJpY29ucyI6IFsKICAgIHsKICAgICAgInNyYyI6ICJodHRwczovL2Nkbi1pY29ucy1wbmcuZmxhdGljb24uY29tLzUxMi8yODcvMjg3NjI4LnBuZyIsCiAgICAgICJ0eXBlIjogImltYWdlL3BuZyIsCiAgICAgICJzaXplcyI6ICI1MTJ4NTEyIgogICAgfQogIF0KfQ==">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Tesseract.js pro OCR -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <style>
        :root {
            --bg-color: #0c0c0c;
            --panel-bg: #161616;
            --accent-color: #ff3b30;
            --green-color: #04b033;
            --blue-color: #007aff;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Kontejner pro živé zrcadlo */
        #container {
            flex: 1;
            position: relative;
            width: 100%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        video {
            display: none; /* Snímaný stream běží skrytě na pozadí */
        }

        canvas#mirror-canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
        }

        /* Průhledná vrstva na kreslení výstřižku */
        #crop-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
        }

        #crop-overlay.active {
            pointer-events: auto;
            cursor: crosshair;
        }

        .crop-area {
            position: absolute;
            border: 2px dashed var(--accent-color);
            background: rgba(255, 59, 48, 0.15);
            display: none;
            pointer-events: none;
        }

        /* Kulatá tlačítka vpravo nahoře */
        .top-controls {
            position: absolute;
            top: 40px;
            right: 20px;
            display: flex;
            gap: 12px;
            z-index: 10;
        }

        .circle-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(22, 22, 22, 0.85);
            backdrop-filter: blur(10px);
            color: var(--text-color);
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: all 0.2s ease;
        }

        .circle-btn:active {
            transform: scale(0.9);
        }

        .circle-btn.active {
            background: var(--green-color);
            border-color: var(--green-color);
        }

        .circle-btn.cropping-mode {
            background: var(--blue-color);
            border-color: var(--blue-color);
            animation: pulse-blue 1.5s infinite;
        }

        @keyframes pulse-blue {
            0% { box-shadow: 0 0 0 0 rgba(0, 122, 255, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(0, 122, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 122, 255, 0); }
        }

        /* Spodní panel */
        .bottom-panel {
            background-color: var(--panel-bg);
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid #222;
            z-index: 10;
        }

        .debug-crop-preview {
            width: 100px;
            height: 50px;
            background: #000;
            border: 1px solid #444;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #crop-canvas-preview {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .ocr-results {
            flex: 1;
            margin-left: 20px;
            font-size: 14px;
            color: #aaa;
        }

        .ocr-value {
            font-size: 24px;
            font-weight: bold;
            color: #fff;
        }

        #status-toast {
            position: absolute;
            top: 40px;
            left: 20px;
            z-index: 10;
            background: rgba(22, 22, 22, 0.85);
            backdrop-filter: blur(5px);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 13px;
            border: 1px solid rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>

<div id="status-toast">Připraveno ke sdílení</div>

<!-- Plovoucí ovládací tlačítka -->
<div class="top-controls">
    <!-- 1. Audio Gong -->
    <button class="circle-btn active" id="audio-btn">🔊</button>
    <!-- 2. Vybrat sdílení obrazovky (Google Meet styl) -->
    <button class="circle-btn" id="select-screen-btn">🖥️</button>
    <!-- 3. Nástroj Výstřižek (Crop) -->
    <button class="circle-btn" id="crop-tool-btn">✂️</button>
</div>

<!-- Hlavní zrcadlící plátno -->
<div id="container">
    <video id="webcam" autoplay playsinline></video>
    <canvas id="mirror-canvas"></canvas>
    
    <!-- Aktivní vrstva pro kreslení ořezu -->
    <div id="crop-overlay">
        <div class="crop-area" id="crop-indicator"></div>
    </div>
</div>

<!-- Spodní debug panel s náhledem výřezu -->
<div class="bottom-panel">
    <div class="debug-crop-preview">
        <canvas id="crop-canvas-preview"></canvas>
    </div>
    <div class="ocr-results">
        <div>Čtení rychlosti / limitu:</div>
        <div class="ocr-value" id="ocr-detected-text">--</div>
    </div>
</div>

<script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('mirror-canvas');
    const ctx = canvas.getContext('2d');

    const cropOverlay = document.getElementById('crop-overlay');
    const cropIndicator = document.getElementById('crop-indicator');
    
    const cropCanvasPreview = document.getElementById('crop-canvas-preview');
    const cropPreviewCtx = cropCanvasPreview.getContext('2d');

    const audioBtn = document.getElementById('audio-btn');
    const selectScreenBtn = document.getElementById('select-screen-btn');
    const cropToolBtn = document.getElementById('crop-tool-btn');
    const ocrDetectedText = document.getElementById('ocr-detected-text');
    const statusToast = document.getElementById('status-toast');

    let stream = null;
    let isCroppingMode = false;
    let gongEnabled = true;
    let audioCtx = null;

    // Relativní koordináty výřezu (výchozí nastavení na střed)
    let cropCoords = { x: 0.1, y: 0.1, w: 0.2, h: 0.1 }; 
    let isDrawing = false;
    let startX = 0, startY = 0;

    let beepIntervalId = null;
    let currentBeepSpeedMode = null; 
    let isFetchingOCR = false;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    audioBtn.addEventListener('click', () => {
        initAudio();
        gongEnabled = !gongEnabled;
        if (gongEnabled) {
            audioBtn.textContent = "🔊";
            audioBtn.classList.add('active');
            playSingleBeep(0.1);
        } else {
            audioBtn.textContent = "🔇";
            audioBtn.classList.remove('active');
            stopBeepLoop();
        }
    });

    // --- 1. ZRCADLENÍ OBRAZOVKY (Google Meet styl) ---
    selectScreenBtn.addEventListener('click', async () => {
        try {
            // Vyvolá systémové okno pro výběr okna/obrazovky
            stream = await navigator.mediaDevices.getDisplayMedia({
                video: { 
                    cursor: "always",
                    displaySurface: "browser" // optimalizace pro okna prohlížeče / aplikací
                },
                audio: false
            });
            
            video.srcObject = stream;
            selectScreenBtn.classList.add('active');
            statusToast.textContent = "Obrazovka nasdílena";
            
            video.onloadedmetadata = () => {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                requestAnimationFrame(tick);
                
                // Nastartujeme OCR analýzu (každých 600 ms)
                setInterval(runOCR, 600);
            };
        } catch (err) {
            console.error("Chyba sdílení obrazovky:", err);
            statusToast.textContent = "Sdílení zrušeno";
        }
    });

    // Nekonečná smyčka překreslování streamu na plátno
    function tick() {
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            drawCropPreview();
        }
        requestAnimationFrame(tick);
    }

    // --- 2. SCREENSHOT CROPPER (Kreslení výřezu) ---
    cropToolBtn.addEventListener('click', () => {
        isCroppingMode = !isCroppingMode;
        if (isCroppingMode) {
            cropToolBtn.classList.add('cropping-mode');
            cropOverlay.classList.add('active');
            statusToast.textContent = "Označ tahem prstu/myši zónu s rychlostí";
        } else {
            cropToolBtn.classList.remove('cropping-mode');
            cropOverlay.classList.remove('active');
        }
    });

    // Pomocná funkce pro získání relativních koordinátů kreslení
    function handleStart(clientX, clientY) {
        if (!isCroppingMode) return;
        const rect = cropOverlay.getBoundingClientRect();
        startX = clientX - rect.left;
        startY = clientY - rect.top;
        isDrawing = true;

        cropIndicator.style.left = startX + 'px';
        cropIndicator.style.top = startY + 'px';
        cropIndicator.style.width = '0px';
        cropIndicator.style.height = '0px';
        cropIndicator.style.display = 'block';
    }

    function handleMove(clientX, clientY) {
        if (!isDrawing) return;
        const rect = cropOverlay.getBoundingClientRect();
        const currentX = clientX - rect.left;
        const currentY = clientY - rect.top;

        const width = currentX - startX;
        const height = currentY - startY;

        cropIndicator.style.width = Math.abs(width) + 'px';
        cropIndicator.style.height = Math.abs(height) + 'px';
        cropIndicator.style.left = (width > 0 ? startX : currentX) + 'px';
        cropIndicator.style.top = (height > 0 ? startY : currentY) + 'px';
    }

    function handleEnd(clientX, clientY) {
        if (!isDrawing) return;
        isDrawing = false;
        isCroppingMode = false;
        cropToolBtn.classList.remove('cropping-mode');
        cropOverlay.classList.remove('active');

        const rect = cropOverlay.getBoundingClientRect();
        const endX = clientX - rect.left;
        const endY = clientY - rect.top;

        // Uložení relativního poměru (0 až 1)
        cropCoords.x = Math.min(startX, endX) / rect.width;
        cropCoords.y = Math.min(startY, endY) / rect.height;
        cropCoords.w = Math.abs(endX - startX) / rect.width;
        cropCoords.h = Math.abs(endY - startY) / rect.height;

        cropIndicator.style.display = 'none';
        statusToast.textContent = "Výřez nastaven";
    }

    // Myš
    cropOverlay.addEventListener('mousedown', (e) => handleStart(e.clientX, e.clientY));
    cropOverlay.addEventListener('mousemove', (e) => handleMove(e.clientX, e.clientY));
    cropOverlay.addEventListener('mouseup', (e) => handleEnd(e.clientX, e.clientY));

    // Dotyk (mobil)
    cropOverlay.addEventListener('touchstart', (e) => handleStart(e.touches[0].clientX, e.touches[0].clientY));
    cropOverlay.addEventListener('touchmove', (e) => handleMove(e.touches[0].clientX, e.touches[0].clientY));
    cropOverlay.addEventListener('touchend', (e) => {
        const touch = e.changedTouches[0];
        handleEnd(touch.clientX, touch.clientY);
    });

    // Vykreslení vyříznutého obrazu na náhledové plátno
    function drawCropPreview() {
        if (!stream) return;
        const sourceX = cropCoords.x * canvas.width;
        const sourceY = cropCoords.y * canvas.height;
        const sourceW = cropCoords.w * canvas.width;
        const sourceH = cropCoords.h * canvas.height;

        if (sourceW > 0 && sourceH > 0) {
            cropCanvasPreview.width = sourceW;
            cropCanvasPreview.height = sourceH;
            // Výřez děláme přímo z našeho mirror-canvasu (žádný CORS problém!)
            cropPreviewCtx.drawImage(canvas, sourceX, sourceY, sourceW, sourceH, 0, 0, sourceW, sourceH);
        }
    }

    // --- 3. BLESKOVÉ OCR ČTENÍ TEXTU ---
    async function runOCR() {
        if (!stream || isFetchingOCR) return;
        isFetchingOCR = true;

        const dataUrl = cropCanvasPreview.toDataURL('image/png');

        try {
            // Tesseract.js přečte čísla z výřezu
            const result = await Tesseract.recognize(dataUrl, 'eng', {
                tessedit_char_whitelist: '0123456789/', // vyfiltruje pouze čísla
            });

            const text = result.data.text.trim();
            ocrDetectedText.textContent = text || "--";

            parseAndEvaluate(text);
        } catch (e) {
            console.error(e);
        }
        isFetchingOCR = false;
    }

    function parseAndEvaluate(text) {
        const numbers = text.match(/\d+/g);
        if (!numbers || numbers.length === 0) return;

        let speed = 0;
        let limit = 50;

        if (numbers.length >= 2) {
            // Waze obvykle ukazuje aktuální rychlost jako první a limit jako druhý (např. 58 / 50)
            speed = parseInt(numbers[0]);
            limit = parseInt(numbers[1]);
        } else if (numbers.length === 1) {
            speed = parseInt(numbers[0]);
        }

        const overSpeed = speed - limit;

        if (overSpeed >= 10) {
            // Překročení o 10+ km/h -> vyvádí to a pípá 10x za sekundu
            startBeepLoop("fast", 100);
        } else if (overSpeed >= 2) {
            // Překročení o 2-9 km/h -> pípá 3x za sekundu
            startBeepLoop("slow", 333);
        } else {
            // V limitu -> ticho
            stopBeepLoop();
        }
    }

    // --- 4. AKUSTICKÝ GONG ---
    function startBeepLoop(mode, msInterval) {
        if (!gongEnabled) {
            stopBeepLoop();
            return;
        }
        if (currentBeepSpeedMode === mode) return;

        stopBeepLoop();
        currentBeepSpeedMode = mode;
        playSingleBeep(mode === "fast" ? 0.05 : 0.08);

        beepIntervalId = setInterval(() => {
            playSingleBeep(mode === "fast" ? 0.05 : 0.08);
        }, msInterval);
    }

    function stopBeepLoop() {
        if (beepIntervalId !== null) {
            clearInterval(beepIntervalId);
            beepIntervalId = null;
        }
        currentBeepSpeedMode = null;
    }

    function playSingleBeep(duration) {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc.type = 'sine';
            osc.frequency.setValueAtTime(950, audioCtx.currentTime);

            gainNode.gain.setValueAtTime(0.4, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + duration);
        } catch (e) {
            console.error(e);
        }
    }

    window.onload = initAudio;

    // --- AUTOMATICKÝ UPDATE PWA ---
    if ('serviceWorker' in navigator) {
        const swCode = `
            self.addEventListener('install', (e) => self.skipWaiting());
            self.addEventListener('activate', (e) => e.waitUntil(self.clients.claim()));
            self.addEventListener('fetch', (e) => {
                e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
            });
        `;
        const blob = new Blob([swCode], {type: 'application/javascript'});
        const swUrl = URL.createObjectURL(blob);
        
        navigator.serviceWorker.register(swUrl).then(reg => {
            reg.update();
            reg.addEventListener('updatefound', () => {
                const newWorker = reg.installing;
                newWorker.addEventListener('statechange', () => {
                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                        window.location.reload();
                    }
                });
            });
        }).catch(err => console.error(err));
    }
</script>

</body>
</html>
