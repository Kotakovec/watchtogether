<!DOCTYPE html>
<html lang="cs">
<head>

    <meta name="apple-mobile-web-app-capable" content="yes">

    <!-- Leaflet.js pro mapy -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --bg-color: #0c0c0c;
            --panel-bg: #161616;
            --accent-color: #ff3b30;
            --green-color: #04b033;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #map {
            flex: 1;
            width: 100%;
            background-color: var(--bg-color);
        }

        .leaflet-tile-container {
            filter: invert(100%) hue-rotate(180deg) brightness(60%) contrast(90%);
        }

        .leaflet-container {
            background: var(--bg-color) !important;
        }

        .leaflet-control-attribution {
            display: none !important;
        }

        /* Horní plovoucí status lišta */
        .status-toast {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(22, 22, 22, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 13px;
            color: #aaa;
            max-width: 90%;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .status-toast.error {
            border-color: var(--accent-color);
            color: #ff8e88;
        }

        /* Spodní ovládací panel */
        .control-panel {
            background-color: var(--panel-bg);
            padding: 25px 20px 40px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid #222;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.7);
            z-index: 1001;
        }

        .speed-limit-sign {
            width: 85px;
            height: 85px;
            border: 8px solid var(--accent-color);
            border-radius: 50%;
            background-color: #222;
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: 900;
            box-shadow: 0 4px 15px rgba(255, 59, 48, 0.2);
            transition: border-color 0.3s ease;
        }

        .current-speed-box {
            text-align: center;
            flex: 1;
        }

        .speed-value {
            font-size: 76px;
            font-weight: 900;
            line-height: 1;
            letter-spacing: -2px;
            font-variant-numeric: tabular-nums;
        }

        .speed-unit {
            font-size: 13px;
            color: #666;
            text-transform: uppercase;
            font-weight: bold;
            margin-top: 4px;
            letter-spacing: 1px;
        }

        .gong-button {
            background-color: var(--green-color);
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(4, 176, 51, 0.3);
            transition: all 0.2s ease;
            min-width: 120px;
            text-align: center;
        }

        .gong-button.muted {
            background-color: #333;
            box-shadow: none;
            color: #888;
        }

        .gong-button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

<div class="status-toast" id="status">Hledám GPS signál...</div>

<div id="map"></div>

<div class="control-panel">
    <div class="speed-limit-sign" id="limit-sign">--</div>
    
    <div class="current-speed-box">
        <div class="speed-value" id="current-speed">0</div>
        <div class="speed-unit">KM/H</div>
    </div>

    <button class="gong-button" id="gong-btn">Gong: ZAP</button>
</div>

<script>
    let map, userMarker, accuracyCircle;
    let speechEnabled = true;
    let currentLimit = 50; 
    let lastSpokenTime = 0;
    const speechDelay = 3500;

    // Řízení síťových požadavků
    let isFetching = false;
    let lastQueryTime = 0;
    const minQueryInterval = 1500; // Dotaz na limit pošleme maximálně jednou za 1.5 sekundy

    const OVERPASS_SERVERS = [
        "https://overpass-api.de/api/interpreter",
        "https://overpass.kumi.systems/api/interpreter",
        "https://lz4.overpass-api.de/api/interpreter",
        "https://z.overpass-api.de/api/interpreter"
    ];
    let currentServerIndex = 0;

    const statusElement = document.getElementById('status');
    const speedElement = document.getElementById('current-speed');
    const limitSignElement = document.getElementById('limit-sign');
    const gongBtn = document.getElementById('gong-btn');

    function init() {
        map = L.map('map', { 
            zoomControl: false,
            attributionControl: false 
        }).setView([49.195, 16.608], 16);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        const pulseIcon = L.divIcon({
            className: 'custom-div-icon',
            html: `<div style="background-color: #0a84ff; width: 16px; height: 16px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 10px rgba(10,132,255,0.8);"></div>`,
            iconSize: [16, 16],
            iconAnchor: [8, 8]
        });

        userMarker = L.marker([49.195, 16.608], { icon: pulseIcon }).addTo(map);
        accuracyCircle = L.circle([49.195, 16.608], {
            radius: 0,
            fillColor: '#0a84ff',
            fillOpacity: 0.15,
            color: 'transparent'
        }).addTo(map);

        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(onLocationSuccess, onLocationError, {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            });
        } else {
            showStatus("Chyba: GPS není podporováno.", true);
        }
    }

    gongBtn.addEventListener('click', () => {
        speechEnabled = !speechEnabled;
        if (speechEnabled) {
            gongBtn.textContent = "Gong: ZAP";
            gongBtn.classList.remove('muted');
            speak("Voice alerts active");
        } else {
            gongBtn.textContent = "Gong: VYP";
            gongBtn.classList.add('muted');
        }
    });

    async function onLocationSuccess(position) {
        const coords = position.coords;
        const lat = coords.latitude;
        const lon = coords.longitude;

        let speedKMH = Math.round((coords.speed || 0) * 3.6);
        if (speedKMH < 0) speedKMH = 0;

        speedElement.textContent = speedKMH;
        userMarker.setLatLng([lat, lon]);
        accuracyCircle.setLatLng([lat, lon]).setRadius(coords.accuracy);
        map.setView([lat, lon], 17); // Trochu detailnější zoom pro online režim

        // HLAVNÍ ONLINE DOTAZ: Zeptáme se rovnou na bod, kde právě teď stojíme
        fetchCurrentRoadLimitOnline(lat, lon);

        if (speedKMH >= (currentLimit + 2) && speechEnabled) {
            triggerAlert();
        }
    }

    function onLocationError(error) {
        console.error(error);
        showStatus("Ztráta GPS signálu...", true);
    }

    function showStatus(text, isError = false) {
        statusElement.textContent = text;
        if (isError) {
            statusElement.classList.add('error');
        } else {
            statusElement.classList.remove('error');
        }
        statusElement.style.opacity = "1";
    }

    // Pomocný fetch s krátkým timeoutem, aby aplikace nevisela
    async function fetchWithTimeout(resource, options = {}) {
        const { timeout = 3000 } = options; // Rychlý online timeout (3s)
        const controller = new AbortController();
        const id = setTimeout(() => controller.abort(), timeout);
        try {
            const response = await fetch(resource, { ...options, signal: controller.signal });
            clearTimeout(id);
            return response;
        } catch (error) {
            clearTimeout(id);
            throw error;
        }
    }

    // ČISTĚ ONLINE VYHLEDÁNÍ LIMITU PRO AKTUÁLNÍ POZICI
    async function fetchCurrentRoadLimitOnline(lat, lon) {
        const now = Date.now();
        
        // Pokud zrovna probíhá jiný dotaz nebo od posledního dotazu uběhlo příliš málo času, nezatěžujeme síť
        if (isFetching || (now - lastQueryTime) < minQueryInterval) return;

        isFetching = true;
        lastQueryTime = now;

        // Zeptáme se na nejbližší silnici s tagem maxspeed v okruhu 25 metrů přímo pod naším autem
        const radius = 25;
        const query = `[out:json][timeout:3];way(around:${radius},${lat},${lon})["maxspeed"];out tags;`;
        
        let success = false;
        let attempts = 0;

        while (!success && attempts < 2) {
            const serverUrl = OVERPASS_SERVERS[currentServerIndex];
            const url = `${serverUrl}?data=${encodeURIComponent(query)}`;
            
            try {
                const response = await fetchWithTimeout(url, { timeout: 2500 });
                if (!response.ok) throw new Error();
                
                const data = await response.json();

                if (data.elements && data.elements.length > 0) {
                    // Najdeme nejbližší cestu s limitem
                    let rawLimit = data.elements[0].tags.maxspeed;
                    let limitNum = currentLimit; // Pokud selže parsování, necháme současný

                    if (rawLimit === "urban" || rawLimit.includes("urban")) limitNum = 50;
                    else if (rawLimit === "rural" || rawLimit.includes("rural")) limitNum = 90;
                    else if (rawLimit === "motorway" || rawLimit.includes("motorway")) limitNum = 130;
                    else {
                        const parsed = parseInt(rawLimit);
                        if (!isNaN(parsed)) limitNum = parsed;
                    }

                    currentLimit = limitNum;
                    limitSignElement.textContent = currentLimit;
                    showStatus("Limit aktualizován (Online)");
                    success = true;
                } else {
                    // Pokud pod námi zrovna žádná silnice s označeným limitem není (např. parkoviště, benzínka)
                    success = true; 
                }
            } catch (e) {
                console.warn(`Online dotaz na serveru ${serverUrl} selhal, zkouším záložní...`);
                currentServerIndex = (currentServerIndex + 1) % OVERPASS_SERVERS.length;
                attempts++;
            }
        }

        if (!success) {
            showStatus("Chyba online připojení", true);
        }

        isFetching = false;
    }

    function speak(text) {
        if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 1.1;
            window.speechSynthesis.speak(utterance);
        }
    }

    function triggerAlert() {
        const now = Date.now();
        if (now - lastSpokenTime > speechDelay) {
            speak("Slow down");
            lastSpokenTime = now;
        }
    }

    window.onload = init;

    // Registrace Service Workeru
    if ('serviceWorker' in navigator) {
        const swCode = `
            self.addEventListener('install', (e) => self.skipWaiting());
            self.addEventListener('fetch', (e) => {});
        `;
        const blob = new Blob([swCode], {type: 'application/javascript'});
        const swUrl = URL.createObjectURL(blob);
        navigator.serviceWorker.register(swUrl).catch(err => console.error(err));
    }
</script>

</body>
</html>
