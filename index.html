<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Speed Guardian Online</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="data:application/manifest+json;base64,ewogICJuYW1lIjogIlNwZWVkIEd1YXJkaWFuIiwKICAic2hvcnRfbmFtZSI6ICJTcGVlZEd1YXJkIiwKICAic3RhcnRfdXJsIjogIi4iLAogICJkaXNwbGF5IjogInN0YW5kYWxvbmUiLAogICJiYWNrZ3JvdW5kX2NvbG9yIjogIiMwYzBjMGMiLAogICJ0aGVtZV9jb2xvciI6ICIjZmYzYjMwIiwKICAiaWNvbnMiOiBbCiAgICB7CiAgICAgICJzcmMiOiAiaHR0cHM6Ly9jZG4taWNvbnMtcG5nLmZsYXRpY29uLmNvbS81MTIvMjg3LzI4NzYyOC5wbmciLAogICAgICAidHlwZSI6ICJpbWFnZS9wbmciLAogICAgICAidHlwZSI6ICI1MTJ4NTEyIgogICAgfQogIF0KfQ==">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Leaflet.js pro mapy -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --bg-color: #0c0c0c;
            --panel-bg: #161616;
            --accent-color: #ff3b30;
            --green-color: #04b033;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #map {
            flex: 1;
            width: 100%;
            background-color: var(--bg-color);
        }

        .leaflet-tile-container {
            filter: invert(100%) hue-rotate(180deg) brightness(60%) contrast(90%);
        }

        .leaflet-container {
            background: var(--bg-color) !important;
        }

        .leaflet-control-attribution {
            display: none !important;
        }

        /* Horní plovoucí status lišta */
        .status-toast {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(22, 22, 22, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 13px;
            color: #aaa;
            max-width: 90%;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        /* Spodní ovládací panel */
        .control-panel {
            background-color: var(--panel-bg);
            padding: 25px 20px 40px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid #222;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.7);
            z-index: 1001;
        }

        .speed-limit-sign {
            width: 85px;
            height: 85px;
            border: 8px solid var(--accent-color);
            border-radius: 50%;
            background-color: #222;
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: 900;
            box-shadow: 0 4px 15px rgba(255, 59, 48, 0.2);
            transition: border-color 0.3s ease;
        }

        .current-speed-box {
            text-align: center;
            flex: 1;
        }

        .speed-value {
            font-size: 76px;
            font-weight: 900;
            line-height: 1;
            letter-spacing: -2px;
            font-variant-numeric: tabular-nums;
        }

        .speed-unit {
            font-size: 13px;
            color: #666;
            text-transform: uppercase;
            font-weight: bold;
            margin-top: 4px;
            letter-spacing: 1px;
        }

        .gong-button {
            background-color: var(--green-color);
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(4, 176, 51, 0.3);
            transition: all 0.2s ease;
            min-width: 120px;
            text-align: center;
        }

        .gong-button.muted {
            background-color: #333;
            box-shadow: none;
            color: #888;
        }

        .gong-button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

<div class="status-toast" id="status">Hledám GPS...</div>

<div id="map"></div>

<div class="control-panel">
    <div class="speed-limit-sign" id="limit-sign">--</div>
    
    <div class="current-speed-box">
        <div class="speed-value" id="current-speed">0</div>
        <div class="speed-unit">KM/H</div>
    </div>

    <button class="gong-button" id="gong-btn">Gong: ZAP</button>
</div>

<script>
    let map, userMarker, accuracyCircle;
    let gongEnabled = true;
    let currentLimit = 50; 
    let currentSpeed = 0;

    // Pole pro uchování projeté trasy
    let routeHistory = [];
    let glowPolyline, corePolyline;

    // Řízení pípací smyčky
    let beepIntervalId = null;
    let currentBeepSpeedMode = null; 

    // Řízení síťových dotazů
    let isFetching = false;
    let lastQueryTime = 0;
    let lastQueryCoords = null;
    const minQueryInterval = 2000; 

    let audioCtx = null;

    const OVERPASS_SERVERS = [
        "https://overpass-api.de/api/interpreter",
        "https://overpass.kumi.systems/api/interpreter",
        "https://lz4.overpass-api.de/api/interpreter",
        "https://z.overpass-api.de/api/interpreter"
    ];
    let currentServerIndex = 0;

    const statusElement = document.getElementById('status');
    const speedElement = document.getElementById('current-speed');
    const limitSignElement = document.getElementById('limit-sign');
    const gongBtn = document.getElementById('gong-btn');

    function init() {
        map = L.map('map', { 
            zoomControl: false,
            attributionControl: false 
        }).setView([49.195, 16.608], 16);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        // Vykreslení čáry trasy (Glow efekt)
        glowPolyline = L.polyline([], {
            color: '#00bfff',
            weight: 12,
            opacity: 0.4
        }).addTo(map);

        corePolyline = L.polyline([], {
            color: '#ffffff',
            weight: 4,
            opacity: 0.9
        }).addTo(map);

        const pulseIcon = L.divIcon({
            className: 'custom-div-icon',
            html: `<div style="background-color: #0a84ff; width: 16px; height: 16px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 10px rgba(10,132,255,0.8);"></div>`,
            iconSize: [16, 16],
            iconAnchor: [8, 8]
        });

        userMarker = L.marker([49.195, 16.608], { icon: pulseIcon }).addTo(map);
        accuracyCircle = L.circle([49.195, 16.608], {
            radius: 0,
            fillColor: '#0a84ff',
            fillOpacity: 0.15,
            color: 'transparent'
        }).addTo(map);

        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(onLocationSuccess, onLocationError, {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            });
        } else {
            showStatus("Chyba: GPS není podporováno.");
        }
    }

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    gongBtn.addEventListener('click', () => {
        initAudio();
        gongEnabled = !gongEnabled;
        if (gongEnabled) {
            gongBtn.textContent = "Gong: ZAP";
            gongBtn.classList.remove('muted');
            playSingleBeep(0.1); 
        } else {
            gongBtn.textContent = "Gong: VYP";
            gongBtn.classList.add('muted');
            stopBeepLoop();
        }
    });

    async function onLocationSuccess(position) {
        const coords = position.coords;
        const lat = coords.latitude;
        const lon = coords.longitude;

        currentSpeed = Math.round((coords.speed || 0) * 3.6);
        if (currentSpeed < 0) currentSpeed = 0;

        speedElement.textContent = currentSpeed;
        userMarker.setLatLng([lat, lon]);
        accuracyCircle.setLatLng([lat, lon]).setRadius(coords.accuracy);
        map.setView([lat, lon], 17);

        // Záznam trasy
        const currentPoint = [lat, lon];
        if (routeHistory.length === 0 || getDistance(routeHistory[routeHistory.length - 1][0], routeHistory[routeHistory.length - 1][1], lat, lon) > 3) {
            routeHistory.push(currentPoint);
            
            if (routeHistory.length > 1000) {
                routeHistory.shift();
            }

            glowPolyline.setLatLngs(routeHistory);
            corePolyline.setLatLngs(routeHistory);
        }

        // Fallback limity podle rychlosti
        if (currentSpeed > 95 && currentLimit < 90) {
            currentLimit = 130;
            limitSignElement.textContent = currentLimit;
        } else if (currentSpeed > 55 && currentSpeed <= 95 && currentLimit === 50) {
            currentLimit = 90;
            limitSignElement.textContent = currentLimit;
        } else if (currentSpeed <= 40 && currentLimit > 50) {
            currentLimit = 50;
            limitSignElement.textContent = currentLimit;
        }

        // Dotaz na aktuální limit
        fetchCurrentRoadLimitOnline(lat, lon);

        // Pípání
        evaluateBeepState();
    }

    function onLocationError(error) {
        console.error(error);
        showStatus("Vyhledávám GPS signál...");
    }

    function showStatus(text) {
        statusElement.textContent = text;
        statusElement.style.opacity = "1";
    }

    function getDistance(lat1, lon1, lat2, lon2) {
        const R = 6371000;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c;
    }

    async function fetchWithTimeout(resource, options = {}) {
        const { timeout = 2500 } = options;
        const controller = new AbortController();
        const id = setTimeout(() => controller.abort(), timeout);
        try {
            const response = await fetch(resource, { ...options, signal: controller.signal });
            clearTimeout(id);
            return response;
        } catch (error) {
            clearTimeout(id);
            throw error;
        }
    }

    async function fetchCurrentRoadLimitOnline(lat, lon) {
        const now = Date.now();
        
        if (lastQueryCoords) {
            const distanceMoved = getDistance(lastQueryCoords.lat, lastQueryCoords.lon, lat, lon);
            if (distanceMoved < 10 && (now - lastQueryTime) < 10000) {
                return; 
            }
        }

        if (isFetching || (now - lastQueryTime) < minQueryInterval) return;

        isFetching = true;
        lastQueryTime = now;
        lastQueryCoords = { lat, lon };

        const radius = 25;
        const query = `[out:json][timeout:3];way(around:${radius},${lat},${lon})["maxspeed"];out tags;`;
        
        let success = false;
        let attempts = 0;

        while (!success && attempts < 2) {
            const serverUrl = OVERPASS_SERVERS[currentServerIndex];
            const url = `${serverUrl}?data=${encodeURIComponent(query)}`;
            
            try {
                const response = await fetchWithTimeout(url, { timeout: 2000 });
                if (!response.ok) throw new Error();
                
                const data = await response.json();

                if (data.elements && data.elements.length > 0) {
                    let rawLimit = data.elements[0].tags.maxspeed;
                    let limitNum = currentLimit;

                    if (rawLimit === "urban" || rawLimit.includes("urban")) limitNum = 50;
                    else if (rawLimit === "rural" || rawLimit.includes("rural")) limitNum = 90;
                    else if (rawLimit === "motorway" || rawLimit.includes("motorway")) limitNum = 130;
                    else {
                        const parsed = parseInt(rawLimit);
                        if (!isNaN(parsed)) limitNum = parsed;
                    }

                    currentLimit = limitNum;
                    limitSignElement.textContent = currentLimit;
                    showStatus("Online");
                    success = true;
                } else {
                    success = true; 
                }
            } catch (e) {
                currentServerIndex = (currentServerIndex + 1) % OVERPASS_SERVERS.length;
                attempts++;
            }
        }

        isFetching = false;
    }

    function evaluateBeepState() {
        if (!gongEnabled) {
            stopBeepLoop();
            return;
        }

        const overSpeed = currentSpeed - currentLimit;

        if (overSpeed >= 10) {
            startBeepLoop("fast", 100);
        } else if (overSpeed >= 2) {
            startBeepLoop("slow", 333);
        } else {
            stopBeepLoop();
        }
    }

    function startBeepLoop(mode, msInterval) {
        if (currentBeepSpeedMode === mode) return;

        stopBeepLoop();

        currentBeepSpeedMode = mode;
        playSingleBeep(mode === "fast" ? 0.05 : 0.08);

        beepIntervalId = setInterval(() => {
            playSingleBeep(mode === "fast" ? 0.05 : 0.08);
        }, msInterval);
    }

    function stopBeepLoop() {
        if (beepIntervalId !== null) {
            clearInterval(beepIntervalId);
            beepIntervalId = null;
        }
        currentBeepSpeedMode = null;
    }

    function playSingleBeep(duration) {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc.type = 'sine';
            osc.frequency.setValueAtTime(950, audioCtx.currentTime);

            gainNode.gain.setValueAtTime(0.4, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + duration);
        } catch (e) {
            console.error(e);
        }
    }

    window.onload = init;

    // --- AKTUALIZAČNÍ LOGIKA PRO PWA (BEZ MAZÁNÍ IKONY) ---
    if ('serviceWorker' in navigator) {
        // Vygenerování aktualizačního Service Workeru jako Blob
        const swCode = `
            const CACHE_NAME = 'speed-guardian-v1';
            
            self.addEventListener('install', (e) => {
                // Přeskočí čekání na zavření všech záložek a ihned se aktivuje
                self.skipWaiting();
            });

            self.addEventListener('activate', (e) => {
                // Okamžitě převezme kontrolu nad všemi klienty (otevřenými okny)
                e.waitUntil(self.clients.claim());
            });

            self.addEventListener('fetch', (e) => {
                // Síť na prvním místě, ať se vždy stahuje nejnovější kód z internetu
                e.respondWith(
                    fetch(e.request).catch(() => {
                        return caches.match(e.request);
                    })
                );
            });
        `;
        const blob = new Blob([swCode], {type: 'application/javascript'});
        const swUrl = URL.createObjectURL(blob);
        
        navigator.serviceWorker.register(swUrl).then(reg => {
            // Kontrola aktualizace na pozadí při každém spuštění
            reg.update();

            // Pokud se na pozadí nainstaloval nový Service Worker, okamžitě obnovíme stránku
            reg.addEventListener('updatefound', () => {
                const newWorker = reg.installing;
                newWorker.addEventListener('statechange', () => {
                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                        console.log('Nalezena nová verze, aktualizuji aplikaci...');
                        showStatus("Aktualizuji aplikaci na novou verzi...");
                        setTimeout(() => {
                            window.location.reload();
                        }, 1000);
                    }
                });
            });
        }).catch(err => console.error('Chyba registrace SW:', err));
    }
</script>

</body>
