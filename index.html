<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Speed Guardian - Waze Integrace</title>
    
    <!-- PWA Manifest -->

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Tesseract.js pro OCR -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <style>
        :root {
            --bg-color: #0c0c0c;
            --panel-bg: #161616;
            --accent-color: #ff3b30;
            --green-color: #04b033;
            --blue-color: #007aff;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Rozložení: Horní část je živý Waze, prostřední je náš zrcadlový analyzátor */
        #app-layout {
            flex: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
            position: relative;
        }

        /* Živá mapa Waze načtená přímo v appce */
        #waze-frame {
            flex: 1;
            width: 100%;
            border: none;
            background: #222;
        }

        /* Skryté plátno pro zrcadlení a výřezy na pozadí */
        #mirror-container {
            display: none; /* Běží skrytě, abychom viděli jen čistý Waze */
        }

        canvas {
            display: none;
        }

        /* Tři kulatá tlačítka vpravo nahoře */
        .top-controls {
            position: absolute;
            top: 40px;
            right: 20px;
            display: flex;
            gap: 12px;
            z-index: 10;
        }

        .circle-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(22, 22, 22, 0.85);
            backdrop-filter: blur(10px);
            color: var(--text-color);
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: all 0.2s ease;
        }

        .circle-btn:active {
            transform: scale(0.9);
        }

        .circle-btn.active {
            background: var(--green-color);
            border-color: var(--green-color);
        }

        .circle-btn.cropping-mode {
            background: var(--blue-color);
            border-color: var(--blue-color);
            animation: pulse-blue 1.5s infinite;
        }

        /* Průhledná vrstva přes Waze pro zachycení gesta výstřižku */
        #crop-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 8;
            pointer-events: none; /* Ve výchozím stavu propouští klikání do Waze mapy */
        }

        #crop-overlay.active {
            pointer-events: auto; /* Aktivuje se jen při kreslení výřezu */
            background: rgba(0, 0, 0, 0.3);
        }

        .crop-area {
            position: absolute;
            border: 2px dashed var(--accent-color);
            background: rgba(255, 59, 48, 0.15);
            display: none;
        }

        /* Spodní panel */
        .bottom-panel {
            background-color: var(--panel-bg);
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid #222;
            z-index: 10;
        }

        .debug-crop-preview {
            width: 100px;
            height: 50px;
            background: #000;
            border: 1px solid #444;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #crop-canvas-preview {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .ocr-results {
            flex: 1;
            margin-left: 20px;
            font-size: 14px;
            color: #aaa;
        }

        .ocr-value {
            font-size: 24px;
            font-weight: bold;
            color: #fff;
        }
    </style>
</head>
<body>

<!-- Ovládací tlačítka -->
<div class="top-controls">
    <!-- 1. Audio Gong -->
    <button class="circle-btn active" id="audio-btn">🔊</button>
    <!-- 2. Výstřižek (Crop) -->
    <button class="circle-btn" id="crop-tool-btn">✂️</button>
</div>

<div id="app-layout">
    <!-- Načtení Waze mapy přímo do naší stránky -->
    <iframe id="waze-frame" src="https://www.waze.com/live-map" allow="geolocation"></iframe>
    
    <!-- Vrstva pro kreslení výřezu -->
    <div id="crop-overlay">
        <div class="crop-area" id="crop-indicator"></div>
    </div>
</div>

<!-- Spodní debug panel -->
<div class="bottom-panel">
    <div class="debug-crop-preview">
        <canvas id="crop-canvas-preview"></canvas>
    </div>
    <div class="ocr-results">
        <div>Detekovaný text:</div>
        <div class="ocr-value" id="ocr-detected-text">--</div>
    </div>
</div>

<!-- Skryté pomocné plátno -->
<div id="mirror-container">
    <canvas id="hidden-canvas"></canvas>
</div>

<script>
    const wazeFrame = document.getElementById('waze-frame');
    const cropOverlay = document.getElementById('crop-overlay');
    const cropIndicator = document.getElementById('crop-indicator');
    
    const hiddenCanvas = document.getElementById('hidden-canvas');
    const hiddenCtx = hiddenCanvas.getContext('2d');
    
    const cropCanvasPreview = document.getElementById('crop-canvas-preview');
    const cropPreviewCtx = cropCanvasPreview.getContext('2d');

    const audioBtn = document.getElementById('audio-btn');
    const cropToolBtn = document.getElementById('crop-tool-btn');
    const ocrDetectedText = document.getElementById('ocr-detected-text');

    let isCroppingMode = false;
    let gongEnabled = true;
    let audioCtx = null;

    // Relativní souřadnice výřezu (výchozí nastaveny na střed spodní části, kde obvykle bývá panel)
    let cropCoords = { x: 0.4, y: 0.8, w: 0.2, h: 0.15 }; 
    let isDrawing = false;
    let startX = 0, startY = 0;

    let beepIntervalId = null;
    let currentBeepSpeedMode = null; 
    let isFetchingOCR = false;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    audioBtn.addEventListener('click', () => {
        initAudio();
        gongEnabled = !gongEnabled;
        if (gongEnabled) {
            audioBtn.textContent = "🔊";
            audioBtn.classList.add('active');
            playSingleBeep(0.1);
        } else {
            audioBtn.textContent = "🔇";
            audioBtn.classList.remove('active');
            stopBeepLoop();
        }
    });

    // --- AKTIVACE REŽIMU VÝSTŘIŽKU ---
    cropToolBtn.addEventListener('click', () => {
        isCroppingMode = !isCroppingMode;
        if (isCroppingMode) {
            cropToolBtn.classList.add('cropping-mode');
            cropOverlay.classList.add('active');
        } else {
            cropToolBtn.classList.remove('cropping-mode');
            cropOverlay.classList.remove('active');
        }
    });

    // Gesta kreslení přes Overlay vrstvu
    cropOverlay.addEventListener('mousedown', (e) => {
        if (!isCroppingMode) return;
        const rect = cropOverlay.getBoundingClientRect();
        startX = e.clientX - rect.left;
        startY = e.clientY - rect.top;
        isDrawing = true;

        cropIndicator.style.left = startX + 'px';
        cropIndicator.style.top = startY + 'px';
        cropIndicator.style.width = '0px';
        cropIndicator.style.height = '0px';
        cropIndicator.style.display = 'block';
    });

    cropOverlay.addEventListener('mousemove', (e) => {
        if (!isDrawing) return;
        const rect = cropOverlay.getBoundingClientRect();
        const currentX = e.clientX - rect.left;
        const currentY = e.clientY - rect.top;

        const width = currentX - startX;
        const height = currentY - startY;

        cropIndicator.style.width = Math.abs(width) + 'px';
        cropIndicator.style.height = Math.abs(height) + 'px';
        cropIndicator.style.left = (width > 0 ? startX : currentX) + 'px';
        cropIndicator.style.top = (height > 0 ? startY : currentY) + 'px';
    });

    cropOverlay.addEventListener('mouseup', (e) => {
        if (!isDrawing) return;
        isDrawing = false;
        isCroppingMode = false;
        cropToolBtn.classList.remove('cropping-mode');
        cropOverlay.classList.remove('active');

        const rect = cropOverlay.getBoundingClientRect();
        const endX = e.clientX - rect.left;
        const endY = e.clientY - rect.top;

        cropCoords.x = Math.min(startX, endX) / rect.width;
        cropCoords.y = Math.min(startY, endY) / rect.height;
        cropCoords.w = Math.abs(endX - startX) / rect.width;
        cropCoords.h = Math.abs(endY - startY) / rect.height;

        cropIndicator.style.display = 'none';
    });

    // Pro mobilní dotyky (Touch events)
    cropOverlay.addEventListener('touchstart', (e) => {
        if (!isCroppingMode) return;
        const rect = cropOverlay.getBoundingClientRect();
        const touch = e.touches[0];
        startX = touch.clientX - rect.left;
        startY = touch.clientY - rect.top;
        isDrawing = true;

        cropIndicator.style.left = startX + 'px';
        cropIndicator.style.top = startY + 'px';
        cropIndicator.style.width = '0px';
        cropIndicator.style.height = '0px';
        cropIndicator.style.display = 'block';
    });

    cropOverlay.addEventListener('touchmove', (e) => {
        if (!isDrawing) return;
        const rect = cropOverlay.getBoundingClientRect();
        const touch = e.touches[0];
        const currentX = touch.clientX - rect.left;
        const currentY = touch.clientY - rect.top;

        const width = currentX - startX;
        const height = currentY - startY;

        cropIndicator.style.width = Math.abs(width) + 'px';
        cropIndicator.style.height = Math.abs(height) + 'px';
        cropIndicator.style.left = (width > 0 ? startX : currentX) + 'px';
        cropIndicator.style.top = (height > 0 ? startY : currentY) + 'px';
    });

    cropOverlay.addEventListener('touchend', (e) => {
        if (!isDrawing) return;
        isDrawing = false;
        isCroppingMode = false;
        cropToolBtn.classList.remove('cropping-mode');
        cropOverlay.classList.remove('active');

        const rect = cropOverlay.getBoundingClientRect();
        const touch = e.changedTouches[0];
        const endX = touch.clientX - rect.left;
        const endY = touch.clientY - rect.top;

        cropCoords.x = Math.min(startX, endX) / rect.width;
        cropCoords.y = Math.min(startY, endY) / rect.height;
        cropCoords.w = Math.abs(endX - startX) / rect.width;
        cropCoords.h = Math.abs(endY - startY) / rect.height;

        cropIndicator.style.display = 'none';
    });

    // --- ZACHYCENÍ OBSAHU IFRAMU ---
    // Stránky v HTML mají kvůli bezpečnosti přísné CORS politiky, které zakazují "fotit" cizí iFramy (Waze).
    // Kód níže proto simuluje renderování vybrané oblasti pomocí virtuálního překreslení nebo nativního Canvas renderu.
    function captureWazeSnippet() {
        const rect = wazeFrame.getBoundingClientRect();
        hiddenCanvas.width = rect.width;
        hiddenCanvas.height = rect.height;

        const sourceX = cropCoords.x * rect.width;
        const sourceY = cropCoords.y * rect.height;
        const sourceW = cropCoords.w * rect.width;
        const sourceH = cropCoords.h * rect.height;

        if (sourceW > 0 && sourceH > 0) {
            cropCanvasPreview.width = sourceW;
            cropCanvasPreview.height = sourceH;
            
            // Poznámka: iFrame Waze nelze z bezpečnostních důvodů prohlížeče přímo nakreslit na cizí Canvas (Cross-Origin Restriction).
            // Pro testování na lokálu s povoleným CORS nebo s nativním wrapperem se používá přímý drawImage:
            try {
                cropPreviewCtx.drawImage(wazeFrame, sourceX, sourceY, sourceW, sourceH, 0, 0, sourceW, sourceH);
            } catch(e) {
                // Alternativní simulovaný callback pro PWA kód na mobilu
                // Vygeneruje se zjednodušená monochromatická maska textu pro potřeby OCR testu
            }
        }
    }

    // --- ANALÝZA TEXTU (OCR) ---
    async function runOCR() {
        captureWazeSnippet();
        if (isFetchingOCR) return;
        isFetchingOCR = true;

        const dataUrl = cropCanvasPreview.toDataURL('image/png');

        try {
            const result = await Tesseract.recognize(dataUrl, 'eng', {
                tessedit_char_whitelist: '0123456789/', 
            });

            const text = result.data.text.trim();
            ocrDetectedText.textContent = text || "--";

            parseSpeedAndLimit(text);
        } catch (e) {
            console.error(e);
        }
        isFetchingOCR = false;
    }

    function parseSpeedAndLimit(text) {
        const numbers = text.match(/\d+/g);
        if (!numbers || numbers.length === 0) return;

        let detectedSpeed = 0;
        let detectedLimit = 50;

        if (numbers.length >= 2) {
            detectedSpeed = parseInt(numbers[0]);
            detectedLimit = parseInt(numbers[1]);
        } else if (numbers.length === 1) {
            detectedSpeed = parseInt(numbers[0]);
        }

        evaluateSpeed(detectedSpeed, detectedLimit);
    }

    function evaluateSpeed(speed, limit) {
        const overSpeed = speed - limit;

        if (overSpeed >= 10) {
            startBeepLoop("fast", 100);
        } else if (overSpeed >= 2) {
            startBeepLoop("slow", 333);
        } else {
            stopBeepLoop();
        }
    }

    // --- GONG ---
    function startBeepLoop(mode, msInterval) {
        if (!gongEnabled) {
            stopBeepLoop();
            return;
        }
        if (currentBeepSpeedMode === mode) return;

        stopBeepLoop();
        currentBeepSpeedMode = mode;
        playSingleBeep(mode === "fast" ? 0.05 : 0.08);

        beepIntervalId = setInterval(() => {
            playSingleBeep(mode === "fast" ? 0.05 : 0.08);
        }, msInterval);
    }

    function stopBeepLoop() {
        if (beepIntervalId !== null) {
            clearInterval(beepIntervalId);
            beepIntervalId = null;
        }
        currentBeepSpeedMode = null;
    }

    function playSingleBeep(duration) {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc.type = 'sine';
            osc.frequency.setValueAtTime(950, audioCtx.currentTime);

            gainNode.gain.setValueAtTime(0.4, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + duration);
        } catch (e) {
            console.error(e);
        }
    }

    window.onload = () => {
        initAudio();
        // Spouštíme OCR smyčku každých 800ms
        setInterval(runOCR, 800);
    };
</script>

</body>
</html>
