<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<title>TACHO</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }

  @font-face {
    font-family:'Orbitron';
    src: local('Orbitron');
  }

  html, body {
    width:100%; height:100%;
    background:#000;
    overflow:hidden;
    font-family:'Share Tech Mono', 'Courier New', monospace;
    color:#0ff;
    touch-action:none;
  }

  /* vynutí černou barvu i pod výřezem na foťák / do bezpečných zón displeje */
  html {
    background:#000;
  }

  #app {
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    width:100vw; height:100vh;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* ---------- PORTRAIT: jen text, žádné zbytečné svícení ---------- */
  #portraitNotice {
    display:none;
    flex-direction:column;
    align-items:center;
    gap:14px;
    color:#0a4a4a;
    text-align:center;
    padding:40px;
  }
  #portraitNotice .icon {
    font-size:48px;
    color:#0ff;
    opacity:0.35;
    animation:pulseDim 2.4s ease-in-out infinite;
  }
  #portraitNotice .msg {
    font-family:'Orbitron', sans-serif;
    font-size:14px;
    letter-spacing:3px;
    color:#0ff;
    opacity:0.5;
  }
  @keyframes pulseDim {
    0%,100% { opacity:0.2; }
    50% { opacity:0.5; }
  }

  /* ---------- LANDSCAPE: hlavní tacho obrazovka ---------- */
  #dash {
    position:relative;
    width:100%; height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .center-speed {
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    line-height:0.9;
  }

  .speed-value {
    position:relative;
    font-family:'Orbitron', sans-serif;
    font-weight:900;
    font-size:clamp(90px, 26vw, 220px);
    letter-spacing:-2px;
    font-variant-numeric:tabular-nums;
    transition:opacity 0.15s;
    background-image:
      repeating-linear-gradient(
        to bottom,
        #8ff5e0 0px, #8ff5e0 3px,
        #4fc9ac 4px, #4fc9ac 5px
      );
    background-size: 100% 5px;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter:drop-shadow(0 0 16px rgba(139,255,224,0.7)) drop-shadow(0 0 40px rgba(107,232,207,0.35));
  }

  /* přeškrtnutá nula ve stylu displeje */
  .speed-value .zero {
    position:relative;
    display:inline-block;
  }
  .speed-value .zero::after {
    content:'';
    position:absolute;
    left:14%;
    top:12%;
    width:2%;
    height:76%;
    background:#000;
    transform:rotate(28deg);
    transform-origin:center;
  }

  .speed-unit {
    font-family:'Share Tech Mono', monospace;
    font-size:clamp(13px, 2vw, 19px);
    letter-spacing:10px;
    color:#7a8a87;
    margin-top:10px;
  }

  /* dvojitý ring okolo čísla - vnější plný, vnitřní přerušovaný */
  .ring {
    position:absolute;
    width:min(78vh, 68vw);
    height:min(78vh, 68vw);
    border-radius:50%;
    border:1px solid rgba(120,140,138,0.35);
    pointer-events:none;
  }
  .ring::before {
    content:'';
    position:absolute;
    inset:22px;
    border-radius:50%;
    border:1px dashed rgba(120,140,138,0.3);
  }

  .accuracy-tick {
    position:absolute;
    bottom:12%;
    font-size:10px;
    letter-spacing:2px;
    color:#4a5c59;
    font-family:'Share Tech Mono', monospace;
  }

  /* ---------- vpravo: ujetá vzdálenost + reset ---------- */
  #tripPanel {
    position:absolute;
    right:18px;
    top:50%;
    transform:translateY(-50%);
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:2px;
  }
  .trip-label {
    font-family:'Orbitron', sans-serif;
    font-size:10px;
    letter-spacing:4px;
    color:#065;
  }
  .trip-value {
    font-family:'Orbitron', sans-serif;
    font-size:clamp(22px, 3.4vw, 34px);
    color:#6be8cf;
    text-shadow:0 0 10px rgba(107,232,207,0.35);
    font-variant-numeric:tabular-nums;
  }
  .trip-unit {
    font-size:11px;
    color:#5a6d6a;
    letter-spacing:2px;
    margin-bottom:14px;
  }

  .max-label {
    font-family:'Orbitron', sans-serif;
    font-size:10px;
    letter-spacing:4px;
    color:#4a5c59;
    margin-top:4px;
  }
  .max-value {
    font-family:'Orbitron', sans-serif;
    font-size:clamp(16px, 2.4vw, 22px);
    color:#7a8a87;
    font-variant-numeric:tabular-nums;
  }
  .max-unit {
    font-size:10px;
    color:#4a5c59;
    letter-spacing:2px;
    margin-bottom:10px;
  }

  #resetBtn {
    margin-top:4px;
    background:transparent;
    border:1px solid rgba(107,232,207,0.15);
    color:#4a5c59;
    font-family:'Share Tech Mono', monospace;
    font-size:10px;
    letter-spacing:3px;
    padding:8px 14px;
    border-radius:2px;
    clip-path:polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
    transition:all 0.15s;
  }
  #resetBtn:active {
    color:#6be8cf;
    border-color:rgba(107,232,207,0.5);
    background:rgba(107,232,207,0.06);
  }

  /* ---------- vlevo dole: mapa (zatím placeholder) ---------- */
  #mapBtn {
    position:absolute;
    left:18px;
    bottom:18px;
    width:52px;
    height:52px;
    background:transparent;
    border:1px solid rgba(107,232,207,0.15);
    color:#4a5c59;
    border-radius:2px;
    clip-path:polygon(8px 0, 100% 0, 100% 100%, 0 100%, 0 8px);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    transition:all 0.15s;
  }
  #mapBtn:active {
    color:#6be8cf;
    border-color:rgba(107,232,207,0.5);
    background:rgba(107,232,207,0.06);
  }

  /* ---------- stav vlevo nahoře (GPS status) ---------- */
  #gpsStatus {
    position:absolute;
    left:18px;
    top:16px;
    font-size:10px;
    letter-spacing:2px;
    color:#4a5c59;
    display:flex;
    align-items:center;
    gap:6px;
  }
  #gpsDot {
    width:6px; height:6px;
    border-radius:50%;
    background:#2a3a38;
    transition:background 0.3s;
  }
  #gpsDot.live {
    background:#6be8cf;
    box-shadow:0 0 8px #6be8cf;
  }
  #gpsDot.warn {
    background:#a55;
    box-shadow:0 0 6px #a55;
  }

  /* skryj vše mimo landscape flow gracefully */
  @media (orientation: portrait) {
    #dash { display:none; }
    #portraitNotice { display:flex; }
  }
</style>
</head>
<body>

<div id="app">

  <div id="portraitNotice">
    <div class="icon">⟳</div>
    <div class="msg">OTOČ TELEFON<br>NA ŠÍŘKU</div>
  </div>

  <div id="dash">
    <div id="gpsStatus"><div id="gpsDot"></div><span id="gpsText">HLEDÁM GPS</span></div>

    <div class="ring"></div>
    <div class="center-speed">
      <div class="speed-value" id="speedValue">0</div>
      <div class="speed-unit">KM/H</div>
    </div>
    <div class="accuracy-tick" id="accTick"></div>

    <div id="tripPanel">
      <div class="trip-label">TRASA</div>
      <div class="trip-value" id="tripValue">0.00</div>
      <div class="trip-unit">KM</div>
      <div class="max-label">MAX</div>
      <div class="max-value" id="maxSpeedVal">0</div>
      <div class="max-unit">KM/H</div>
      <button id="resetBtn">RESET</button>
    </div>

    <button id="mapBtn" title="Mapa (brzy)">🗺</button>
  </div>

</div>

<script>
(function(){
  const speedEl = document.getElementById('speedValue');
  const tripEl = document.getElementById('tripValue');
  const gpsDot = document.getElementById('gpsDot');
  const gpsText = document.getElementById('gpsText');
  const accTick = document.getElementById('accTick');
  const maxSpeedVal = document.getElementById('maxSpeedVal');
  const resetBtn = document.getElementById('resetBtn');
  const mapBtn = document.getElementById('mapBtn');

  let tripMeters = parseFloat(localStorage.getItem('tacho_trip') || '0');
  let maxSpeed = parseFloat(localStorage.getItem('tacho_max') || '0');
  let lastPos = null;
  let watchId = null;

  function toRad(d){ return d * Math.PI / 180; }

  // Haversine - vzdálenost mezi dvěma GPS body v metrech
  function distanceMeters(lat1, lon1, lat2, lon2){
    const R = 6371000;
    const dLat = toRad(lat2 - lat1);
    const dLon = toRad(lon2 - lon1);
    const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c;
  }

  function renderTrip(){
    tripEl.textContent = (tripMeters / 1000).toFixed(2);
  }
  function renderMax(){
    maxSpeedVal.textContent = Math.round(maxSpeed);
  }
  renderTrip();
  renderMax();

  function renderSpeedDigits(v){
    // nula se vykresluje jako přeškrtnutá (span.zero), ostatní číslice normálně
    speedEl.innerHTML = String(v).split('').map(ch =>
      ch === '0' ? '<span class="zero">0</span>' : ch
    ).join('');
  }
  renderSpeedDigits(0);

  function setSpeed(kmh){
    const v = Math.max(0, Math.round(kmh));
    renderSpeedDigits(v);
    if (v > maxSpeed){
      maxSpeed = v;
      localStorage.setItem('tacho_max', maxSpeed);
      renderMax();
    }
  }

  function handlePosition(pos){
    gpsDot.classList.add('live');
    gpsDot.classList.remove('warn');
    gpsText.textContent = 'GPS AKTIVNÍ';

    const { latitude, longitude, speed, accuracy } = pos.coords;
    accTick.textContent = '±' + Math.round(accuracy) + 'm';

    // rychlost: preferuj speed z GPS (m/s), fallback na vlastní výpočet
    let kmh;
    if (speed !== null && speed !== undefined && !isNaN(speed)){
      kmh = speed * 3.6;
    } else if (lastPos){
      const dt = (pos.timestamp - lastPos.timestamp) / 1000;
      const d = distanceMeters(lastPos.lat, lastPos.lon, latitude, longitude);
      kmh = dt > 0 ? (d/dt) * 3.6 : 0;
    } else {
      kmh = 0;
    }
    setSpeed(kmh);

    // trasa - jen pokud je přesnost slušná a pohyb je reálný (filtr GPS šumu)
    if (lastPos && accuracy < 30){
      const d = distanceMeters(lastPos.lat, lastPos.lon, latitude, longitude);
      if (d > 1 && d < 200){ // odfiltruje šum a skoky
        tripMeters += d;
        localStorage.setItem('tacho_trip', tripMeters);
        renderTrip();
      }
    }

    lastPos = { lat: latitude, lon: longitude, timestamp: pos.timestamp };
  }

  function handleError(err){
    gpsDot.classList.remove('live');
    gpsDot.classList.add('warn');
    gpsText.textContent = 'GPS CHYBA: ' + err.message;
  }

  function startGPS(){
    if (!('geolocation' in navigator)){
      gpsText.textContent = 'GPS NENÍ DOSTUPNÉ';
      gpsDot.classList.add('warn');
      return;
    }
    watchId = navigator.geolocation.watchPosition(handlePosition, handleError, {
      enableHighAccuracy: true,
      maximumAge: 500,
      timeout: 8000
    });
  }
  startGPS();

  resetBtn.addEventListener('click', () => {
    tripMeters = 0;
    maxSpeed = 0;
    localStorage.setItem('tacho_trip', 0);
    localStorage.setItem('tacho_max', 0);
    renderTrip();
    renderMax();
  });

  mapBtn.addEventListener('click', () => {
    // placeholder - mapa přijde později
    mapBtn.style.color = '#0ff';
    setTimeout(() => { mapBtn.style.color = ''; }, 200);
  });

  // zabránit zhasnutí obrazovky, pokud to prohlížeč podporuje
  let wakeLock = null;
  async function requestWakeLock(){
    try {
      if ('wakeLock' in navigator){
        wakeLock = await navigator.wakeLock.request('screen');
      }
    } catch(e){ /* tichý fail, není kritické */ }
  }
  requestWakeLock();
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') requestWakeLock();
  });

  // registrace service workeru - umožní běh appky úplně offline po první instalaci
  if ('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {
        // tichý fail - appka funguje i bez SW, jen nebude cachovaná pro offline
      });
    });
  }

})();
</script>

</body>
</html>
